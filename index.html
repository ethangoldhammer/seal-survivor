<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report anything
       other than 0. ui.js and tipJar.js have padded against those insets for
       ages; without this the padding was always zero and the notch was only
       ever missed by luck. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Seal Survivor</title>
  <!-- Generated from the splash art by `npm run icons:app`, so the tab, a
       home-screen bookmark and the real iOS app are all the same picture. -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- Only read when the deployed page is added to a home screen: without it
       Safari draws its own chrome over the game. The native shell ignores all
       of this — it is a real app there, not a bookmark. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#05060a" />
  <style>
    * { margin: 0; padding: 0; outline: none !important; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #05060a; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; }
    canvas { display: block; outline: none !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/path/src/main.js"></script>
</body>
</html>
