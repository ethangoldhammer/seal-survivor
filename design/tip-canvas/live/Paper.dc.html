<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Condensed:wght@400;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif;
      background: radial-gradient(120% 90% at 30% 8%, #1a5678, #04101a 70%); }
    a { color: #b45309; } a:hover { color: #92400e; }
  </style>
</helmet>
<div style="width: 420px; height: 520px; box-sizing: border-box; padding: 26px 24px; color: #cfe6f5">

  <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #7ad7ff">B</div>
    <div style="font-size: 17px; font-weight: 700; color: #eaf6ff">Paper</div>
  </div>
  <div style="font-size: 11px; line-height: 1.5; color: rgba(207,230,245,0.5); margin-bottom: 22px">The kill shot's stock and ink, at tooltip size. The run already prints things; this is one more.</div>

  <div style="display: flex; flex-direction: column; gap: 20px">

    <div style="width: max-content; max-width: 250px; background: #eef2f3; color: #232b33; padding: 8px 8px 6px; border-radius: 2px; box-shadow: 0 8px 22px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.5) inset; transform: rotate(-0.6deg)">
      <div style="background: #e7ebec; padding: 8px 9px 9px; border-radius: 1px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 1px solid rgba(35,43,51,0.18); padding-bottom: 5px">
          <span style="font-family: 'Roboto Condensed', 'Inter', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.01em; text-transform: uppercase">Shrimp Ring</span>
          <span style="font-family: 'Roboto Condensed', sans-serif; font-size: 12px; font-variant-numeric: tabular-nums; color: rgba(35,43,51,0.62)">&#215;4</span>
        </div>
        <div style="display: grid; grid-template-columns: max-content 1fr; column-gap: 9px; row-gap: 5px; margin-top: 7px; align-items: baseline; font-size: 11px; line-height: 1.35">
          <span style="font-family: 'Roboto Condensed', sans-serif; text-transform: uppercase; white-space: nowrap; font-size: 9px; letter-spacing: 0.1em; color: rgba(35,43,51,0.5)">[DRAFT] Next</span>
          <span style="font-weight: 600">+1 orbiting shrimp &#183; 6 &#8594; 7</span>
          <span style="font-family: 'Roboto Condensed', sans-serif; text-transform: uppercase; white-space: nowrap; font-size: 9px; letter-spacing: 0.1em; color: rgba(35,43,51,0.5)">[DRAFT] This run</span>
          <span style="font-variant-numeric: tabular-nums; color: rgba(35,43,51,0.78)">Shrimp Ring: 261k dealt &#183; 92 kills</span>
        </div>
      </div>
      <div style="height: 12px"></div>
    </div>

    <div style="width: max-content; max-width: 250px; background: #eef2f3; color: #232b33; padding: 8px 8px 6px; border-radius: 2px; box-shadow: 0 8px 22px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.5) inset; transform: rotate(0.9deg)">
      <div style="background: #e7ebec; padding: 8px 9px 9px; border-radius: 1px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 1px solid rgba(35,43,51,0.18); padding-bottom: 5px">
          <span style="font-family: 'Roboto Condensed', 'Inter', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.01em; text-transform: uppercase">Yoga</span>
          <span style="font-family: 'Roboto Condensed', sans-serif; font-size: 12px; font-variant-numeric: tabular-nums; color: rgba(35,43,51,0.62)">&#215;5</span>
        </div>
        <div style="font-size: 11px; font-style: italic; color: rgba(35,43,51,0.6); margin-top: 6px">Breathe deeper, Seal.</div>
        <div style="display: grid; grid-template-columns: max-content 1fr; column-gap: 9px; row-gap: 5px; margin-top: 7px; align-items: baseline; font-size: 11px; line-height: 1.35">
          <span style="font-family: 'Roboto Condensed', sans-serif; text-transform: uppercase; white-space: nowrap; font-size: 9px; letter-spacing: 0.1em; color: rgba(35,43,51,0.5)">[DRAFT] Next</span>
          <span style="font-weight: 600">[DRAFT] Maxed</span>
          <span style="font-family: 'Roboto Condensed', sans-serif; text-transform: uppercase; white-space: nowrap; font-size: 9px; letter-spacing: 0.1em; color: rgba(35,43,51,0.5)">[DRAFT] Now</span>
          <span>+150 max oxygen</span>
        </div>
      </div>
      <div style="height: 12px"></div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
