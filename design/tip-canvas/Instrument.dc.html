<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif;
      background: radial-gradient(120% 90% at 30% 8%, #1a5678, #04101a 70%); }
    a { color: #9fe3ff; } a:hover { color: #cfeaff; }
  </style>
</helmet>
<div style="width: 420px; height: 520px; box-sizing: border-box; padding: 26px 24px; color: #cfe6f5">

  <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #7ad7ff">C</div>
    <div style="font-size: 17px; font-weight: 700; color: #eaf6ff">Instrument</div>
  </div>
  <div style="font-size: 11px; line-height: 1.5; color: rgba(207,230,245,0.5); margin-bottom: 22px">The HUD's own language. The span stops being two numbers and becomes a distance you can see.</div>

  <div style="display: flex; flex-direction: column; gap: 20px">

    <div style="width: 250px; padding: 9px 11px 11px; border-radius: 4px; background: linear-gradient(180deg, rgba(10,20,29,0.97), rgba(5,12,18,0.97)); border: 1px solid rgba(122,215,255,0.22); border-left: 2px solid #7ad7ff; box-shadow: 0 6px 20px rgba(0,0,0,0.6); font-size: 11px; line-height: 1.4">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #eaf6ff">Shrimp Ring</span>
        <span style="font-size: 10px; font-variant-numeric: tabular-nums; color: rgba(122,215,255,0.8)">&#215;4</span>
      </div>

      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 10px">
        <span style="font-size: 15px; font-weight: 700; color: #9fe3ff; font-variant-numeric: tabular-nums">+1</span>
        <span style="font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(232,236,243,0.45)">orbiting shrimp</span>
      </div>

      <div style="position: relative; height: 7px; margin-top: 7px; border-radius: 4px; background: rgba(4,12,18,0.9); box-shadow: inset 0 0 0 1px rgba(122,215,255,0.14)">
        <div style="position: absolute; inset: 0 25% 0 0; border-radius: 4px; background: linear-gradient(90deg, #2f9fdd, #9fe4ff); box-shadow: 0 0 10px rgba(110,210,255,0.6)"></div>
        <div style="position: absolute; top: -2px; bottom: -2px; left: 75%; width: 2px; border-radius: 1px; background: #eaf6ff; box-shadow: 0 0 8px rgba(255,255,255,0.85)"></div>
      </div>
      <div style="display: flex; justify-content: space-between; margin-top: 4px; font-size: 9px; font-variant-numeric: tabular-nums; color: rgba(232,236,243,0.45)">
        <span>6</span><span style="color: #eaf6ff">7</span>
      </div>

      <div style="margin-top: 9px; padding-top: 8px; border-top: 1px solid rgba(122,215,255,0.14); display: flex; gap: 14px; font-variant-numeric: tabular-nums">
        <span><span style="font-size: 13px; font-weight: 700; color: #ff6a5a">261k</span> <span style="font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(232,236,243,0.45)">[DRAFT] dealt</span></span>
        <span><span style="font-size: 13px; font-weight: 700; color: #cfeaff">92</span> <span style="font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(232,236,243,0.45)">[DRAFT] kills</span></span>
      </div>
    </div>

    <div style="width: 250px; padding: 9px 11px 11px; border-radius: 4px; background: linear-gradient(180deg, rgba(10,20,29,0.97), rgba(5,12,18,0.97)); border: 1px solid rgba(122,215,255,0.22); border-left: 2px solid rgba(255,209,102,0.85); box-shadow: 0 6px 20px rgba(0,0,0,0.6); font-size: 11px; line-height: 1.4">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #eaf6ff">Yoga</span>
        <span style="font-size: 10px; font-variant-numeric: tabular-nums; color: rgba(122,215,255,0.8)">&#215;5</span>
      </div>
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 10px">
        <span style="font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #ffd166">[DRAFT] Maxed</span>
        <span style="font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(232,236,243,0.45)">max oxygen</span>
      </div>
      <div style="position: relative; height: 7px; margin-top: 7px; border-radius: 4px; background: rgba(4,12,18,0.9); box-shadow: inset 0 0 0 1px rgba(255,209,102,0.18)">
        <div style="position: absolute; inset: 0; border-radius: 4px; background: linear-gradient(90deg, #ff8a00, #ffd166); box-shadow: 0 0 12px rgba(255,160,40,0.75)"></div>
      </div>
      <div style="display: flex; justify-content: space-between; margin-top: 4px; font-size: 9px; font-variant-numeric: tabular-nums; color: rgba(232,236,243,0.45)">
        <span>0</span><span style="color: #eaf6ff">150</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
