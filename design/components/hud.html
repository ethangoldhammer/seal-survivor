<!-- @dsCard group="Screens" name="In-run HUD" subtitle="Level meter, score/time corner, player bars, score toasts" viewport="920x580" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seal Survivor — HUD</title>
<link rel="stylesheet" href="../styles.css" />
<style>
/* Preview scaffolding only — none of this ships. */
html, body { margin: 0; height: 100%; }
.stage { position: relative; width: 100%; height: 100vh; overflow: hidden;
  background: radial-gradient(125% 95% at 50% 0%, #1d4b6b 0%, #0d2a42 45%, #061523 100%); }
.stage .sv-ui { position: absolute; }
/* Stand-in for the seal. In game the player bars are positioned every frame
   from the seal's projected world position; here they are placed by hand. */
.seal-mark { position: absolute; width: 54px; height: 26px; border-radius: 50%;
  background: #6b7a8d; opacity: 0.55; transform: translate(-50%, -50%); }
.state-note { position: absolute; font: 500 10px 'Inter', system-ui, sans-serif;
  letter-spacing: 0.08em; text-transform: uppercase; color: rgba(232,236,243,0.4);
  transform: translateX(-50%); }
</style>
</head>
<body>
<div class="stage">
  <div class="sv-ui">
    <!-- THE PRODUCT, AND ONLY THE PRODUCT. `points` arrives already multiplied,
         so a combo toast is the same number in a different colour — the "×2.4"
         tag that used to ride along was arithmetic homework at the moment there
         is least time to do it. .sv-toast-combo is the whole difference. -->
    <div class="sv-toast-layer" id="svToastLayer">
      <div class="sv-toast" style="left:300px; top:190px;">+120</div>
      <div class="sv-toast sv-toast-combo" style="left:430px; top:150px;">+540</div>
      <div class="sv-toast" style="left:520px; top:235px; opacity:0.45;">+80</div>
    </div>

    <div class="sv-hud" id="svHud">
      <!-- The label lives INSIDE the track, on its own dark plate, so the fill
           can sweep under it without eating the type. Both words are in the
           markup and one is hidden per breakpoint — "Level" on a desktop, "Lv"
           stacked over the number once the meter is up the left edge.
           The fill is SCALED, not sized: --sv-xp is the 0..1 fraction updateHUD
           writes, which is what lets the responsive block stand the same
           element on end without the JS knowing. -->
      <div class="sv-xptop">
        <div class="sv-xptop-fill" id="svXpBar" style="--sv-xp:0.62;"></div>
        <div class="sv-xptop-level"><span class="sv-xptop-word">Level</span><span class="sv-xptop-abbr">Lv</span><span id="svLevel">7</span></div>
      </div>

      <!-- #svPlayerBars belongs here in initUI's markup. It is hand-placed
           below instead: it is absolute and anchored per frame from the seal's
           projected position, so left in flow with no anchor it would sit on
           top of the level meter. -->

      <!-- THE CORNER. Score and clock as ONE block rather than as loose panels
           in the HUD's flex row, because on a phone the whole group moves to
           the opposite corner of the screen.
           NO LABELS: a running total counts up and a clock is punctuated like a
           clock, so "Score" and "Time" were captions on two things that already
           said what they were. Both are .sv-value so the Text panel owns them
           as one role; the clock is set back with opacity, which typography.js
           does not write. -->
      <div class="sv-hud-corner" id="svCorner">
        <div class="sv-panel">
          <div class="sv-value" id="svScore">12,480</div>
          <div class="sv-value sv-hud-time" id="svTime">3:24</div>
        </div>
      </div>
      <!-- No rapid-fire read-out. It was a second panel here counting a timer
           down, and it said nothing the fight was not already saying. -->
      <!-- Strike charges are drawn as a ring around the seal by
           systems/strikeRing.js, not as HUD markup. -->
    </div>

    <!-- The three bar states, placed by hand where the seal would be. In game
         there is one stack and it follows the player. -->

    <!-- Healthy + idle: both bars full, so the stack fades back to 0.3. -->
    <div class="seal-mark" style="left:250px; top:390px;"></div>
    <div class="sv-playerbars" id="svPlayerBars" style="left:210px; top:390px; opacity:0.3;">
      <div class="sv-pbar-wrap" id="svHpWrap" style="--sv-alarm:0.0;">
        <div class="sv-pbar-ghost" id="svHpGhost" style="--sv-fill:1;"></div>
        <div class="sv-pbar sv-pbar-hp" id="svHpBar" style="--sv-fill:1;"></div>
      </div>
      <div class="sv-pbar-wrap" id="svO2Wrap" style="--sv-alarm:0.0;">
        <div class="sv-pbar-ghost" id="svO2Ghost" style="--sv-fill:1;"></div>
        <div class="sv-pbar sv-pbar-o2" id="svO2Bar" style="--sv-fill:1;"></div>
      </div>
    </div>
    <div class="state-note" style="left:250px; top:440px;">Idle · faded</div>

    <!-- Just bitten: the pale band above the red fill is the damage still on
         its way down. In game the fill chases the real value and the trail
         chases the fill (PBAR_SMOOTH in ui.js); here one frame of that is
         frozen by hand, since a static specimen has no clock. -->
    <div class="seal-mark" style="left:460px; top:390px;"></div>
    <div class="sv-playerbars" style="left:420px; top:390px;">
      <div class="sv-pbar-wrap" style="--sv-alarm:0.0;">
        <div class="sv-pbar-ghost" style="--sv-fill:0.62;"></div>
        <div class="sv-pbar sv-pbar-hp" style="--sv-fill:0.38;"></div>
      </div>
      <div class="sv-pbar-wrap" style="--sv-alarm:0.0;">
        <div class="sv-pbar-ghost" style="--sv-fill:0.64;"></div>
        <div class="sv-pbar sv-pbar-o2" style="--sv-fill:0.64;"></div>
      </div>
    </div>
    <div class="state-note" style="left:460px; top:440px;">Just bitten · trail</div>

    <!-- Drowning: air under 25% flips the bar to AMBER — not red, which is
         health's colour and would leave two identical columns — and --sv-alarm
         brightens the whole track. That property is written per frame already
         oscillating, so this is the top of its wave. -->
    <div class="seal-mark" style="left:670px; top:390px;"></div>
    <div class="sv-playerbars" style="left:630px; top:390px;">
      <div class="sv-pbar-wrap" style="--sv-alarm:0.0;">
        <div class="sv-pbar-ghost" style="--sv-fill:0.72;"></div>
        <div class="sv-pbar sv-pbar-hp" style="--sv-fill:0.72;"></div>
      </div>
      <div class="sv-pbar-wrap" style="--sv-alarm:0.85;">
        <div class="sv-pbar-ghost" style="--sv-fill:0.14;"></div>
        <div class="sv-pbar sv-pbar-o2 sv-o2-low" style="--sv-fill:0.14;"></div>
      </div>
    </div>
    <div class="state-note" style="left:670px; top:440px;">Low air · alarm</div>
  </div>
</div>
</body>
</html>
