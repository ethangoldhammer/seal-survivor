<!doctype html>
<meta charset="utf-8">
<title>Seal Survivor — table editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1418; --panel: #161d23; --line: #26313a; --text: #dfe8ee;
    --dim: #8ba0af; --accent: #4fc3f7; --dirty: #f5c542; --bad: #ff6b6b;
    --ok: #5ddc9a; --field: #0c1216; --draft: #d98b3a; --review: #6f8fa6;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa; --panel: #fff; --line: #dde4ea; --text: #17242e;
      --dim: #5c7180; --accent: #0b7fb5; --dirty: #a9761a; --bad: #c92a2a;
      --ok: #14804a; --field: #fff; --draft: #a15c12; --review: #4a6b80;
    }
  }
  * { box-sizing: border-box; }
  /* One scrolling region, the grid. Letting the page scroll too puts the
     blurb under the sticky toolbar and gives you two scrollbars that both
     look like they move the table. */
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
    height: 100vh; overflow: hidden; display: flex; flex-direction: column;
  }

  header {
    flex: none; z-index: 30; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 10px 16px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  /* ONE PICKER, NOT ELEVEN TABS. Eleven tabs wrapped to two rows at any window
     narrower than a laptop and pushed the grid down with them, and the two
     tables anyone opens most were the ones that wrapped. A select is also the
     control that says "these are alternatives" — which is exactly what they
     are, since only one is ever on screen. */
  #tableSel {
    appearance: none; cursor: pointer; font: inherit; font-weight: 600;
    padding: 6px 30px 6px 11px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%),
                      linear-gradient(135deg, var(--dim) 50%, transparent 50%);
    background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  #tableSel:hover, #tableSel:focus { border-color: var(--accent); outline: none; }
  /* The unsaved-work marker the tab strip used to carry as a dot. A closed
     select can only show the row you are on, so an edit left on ANOTHER table
     has nowhere to appear — this outlines the whole control instead, and
     `#dirtyElse` names which ones. */
  #tableSel.elsewhere { border-color: var(--dirty); }
  #dirtyElse { color: var(--dirty); font-size: 12px; }
  #dirtyElse:empty { display: none; }

  .grow { flex: 1; }
  input[type="search"] {
    width: 180px; padding: 5px 9px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--field); color: var(--text); font: inherit;
  }
  button.action {
    padding: 6px 13px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--field); color: var(--text); font: inherit; cursor: pointer;
  }
  button.action:hover:not(:disabled) { border-color: var(--accent); }
  button.action:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06222f; font-weight: 600; }
  @media (prefers-color-scheme: light) { button.primary { color: #fff; } }

  .blurb { flex: none; margin: 0; padding: 12px 16px 4px; color: var(--dim); max-width: 78ch; }
  .status { flex: none; margin: 0; padding: 0 16px 10px; min-height: 20px; color: var(--dim); }
  .status.bad { color: var(--bad); }
  .status.ok { color: var(--ok); }

  /* No horizontal padding on the scroller: `left: 0` on the frozen id column
     is relative to the padding box, so a 16px gutter is 16px of the scrolled
     table showing through beside the column that is supposed to cover it. The
     margin lives inside the edge cells instead. */
  .scroller { flex: 1; min-height: 0; overflow: auto; padding: 0 0 25vh; }
  th:first-child, td:first-child { padding-left: 16px; }
  th:last-child, td:last-child { padding-right: 16px; }
  table { border-collapse: separate; border-spacing: 0; }
  th, td { border-bottom: 1px solid var(--line); padding: 0; white-space: nowrap; }
  thead th {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    text-align: left; padding: 7px 8px; font-weight: 600; color: var(--dim);
    border-bottom: 1px solid var(--line); cursor: pointer; user-select: none;
  }
  thead th:hover { color: var(--text); }
  thead th .arrow { color: var(--accent); }

  /* THE RESIZE GRIP. `thead th` is already sticky, which is a positioned
     element, so this anchors to the header cell without adding a
     position:relative that would break the sticky itself. Sits half over the
     border so the target is 7px wide while the line stays 1px. */
  .grip {
    position: absolute; top: 0; right: -3px; width: 7px; height: 100%;
    cursor: col-resize; z-index: 2; touch-action: none;
  }
  .grip::after {
    content: ""; position: absolute; inset: 0 3px; background: var(--accent);
    opacity: 0; transition: opacity .12s;
  }
  .grip:hover::after, .grip.dragging::after { opacity: .8; }
  /* Every cell in the table follows the mouse during a drag, so the text
     selection that a drag would otherwise paint over them is suppressed. */
  body.resizing { cursor: col-resize; user-select: none; }
  th.sticky, td.sticky {
    position: sticky; left: 0; z-index: 12; background: var(--bg);
    border-right: 1px solid var(--line);
  }
  thead th.sticky { z-index: 20; }
  tbody tr:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  tbody tr:hover td.sticky { background: color-mix(in srgb, var(--accent) 6%, var(--bg)); }

  td .cell {
    width: 100%; border: 1px solid transparent; border-radius: 4px;
    background: none; color: var(--text); font: inherit; padding: 5px 7px;
  }
  td .cell:hover { border-color: var(--line); }
  td .cell:focus { outline: none; border-color: var(--accent); background: var(--field); }
  td.num .cell { text-align: right; font-variant-numeric: tabular-nums; }
  td.dirty .cell { border-color: var(--dirty); background: color-mix(in srgb, var(--dirty) 12%, transparent); }
  td.bad .cell { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .cell::placeholder { color: var(--dim); opacity: .55; font-style: italic; }
  td .cell[readonly] { color: var(--dim); cursor: default; }
  td .cell[readonly]:hover { border-color: transparent; }

  /* Widths have to out-specify `td .cell { width: 100% }` above, which is why
     these carry the `td .cell` prefix rather than being bare classes. */
  td .cell.w-num { width: 92px; }
  td .cell.w-text { width: 190px; }
  td .cell.w-wide { width: 340px; }
  td .cell.w-id { width: 150px; }
  td .cell.w-enum { width: 118px; }
  td .cell.w-art { width: 172px; }

  /* A caret, so a cell you can pick from doesn't read as a cell you must type
     into. Same marker on the combo columns, which are both. */
  select.cell, input[list] {
    appearance: none; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%),
                      linear-gradient(135deg, var(--dim) 50%, transparent 50%);
    background-position: calc(100% - 13px) 50%, calc(100% - 8px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 22px;
  }
  input[list] { cursor: text; }
  input[list]::-webkit-calendar-picker-indicator { opacity: 0; }

  .artbtn {
    display: flex; align-items: center; gap: 7px; cursor: pointer;
    width: 100%; text-align: left; overflow: hidden;
  }
  .artbtn img { width: 22px; height: 22px; border-radius: 4px; flex: none; object-fit: cover; }
  .artbtn .swatch { width: 22px; height: 22px; border-radius: 4px; flex: none; border: 1px dashed var(--line); }
  .artbtn span { overflow: hidden; text-overflow: ellipsis; }

  .soundbtn {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    width: 100%; text-align: left; overflow: hidden;
  }
  .soundbtn .tag {
    flex: none; font-size: 10px; padding: 1px 5px; border-radius: 3px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .soundbtn span.nm { overflow: hidden; text-overflow: ellipsis; }
  .playbtn {
    flex: none; border: none; background: none; cursor: pointer;
    color: var(--accent); font-size: 12px; padding: 2px 5px; border-radius: 4px;
  }
  .playbtn:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .playbtn[disabled] { color: var(--dim); opacity: .4; cursor: default; background: none; }

  /* A cell holding SEVERAL ids: reads as chips, edits as a checklist. */
  .multibtn {
    display: flex; align-items: center; gap: 4px; cursor: pointer;
    width: 100%; text-align: left; overflow: hidden; flex-wrap: nowrap;
  }
  .multibtn .chip {
    flex: none; font-size: 11px; padding: 1px 6px; border-radius: 10px;
    border: 1px solid var(--line); color: var(--text);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  .multibtn .more { flex: none; font-size: 11px; color: var(--dim); }
  .multibtn .any { color: var(--dim); font-style: italic; }

  .multimenu {
    position: fixed; z-index: 60; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px; padding: 5px;
    box-shadow: 0 12px 32px #0006; min-width: 210px; max-height: 60vh; overflow: auto;
  }
  .multimenu label {
    display: flex; align-items: center; gap: 8px; padding: 5px 9px;
    border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .multimenu label:hover { background: color-mix(in srgb, var(--accent) 15%, transparent); }
  .multimenu input { accent-color: var(--accent); margin: 0; }
  .multimenu .sep { height: 1px; background: var(--line); margin: 4px 0; }
  .multimenu .clear {
    display: block; width: 100%; text-align: left; border: none; background: none;
    color: var(--dim); font: inherit; font-size: 12px; padding: 5px 9px;
    border-radius: 6px; cursor: pointer;
  }
  .multimenu .clear:hover { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--text); }
  .multimenu .unknown { color: var(--bad); }

  /* A templated cell is the input, a token menu, and the line the card will
     actually read once the placeholders resolve. */
  .tmpl { display: flex; flex-direction: column; gap: 1px; }
  .tmpl-row { display: flex; align-items: center; }
  .tokenbtn {
    flex: none; border: none; background: none; color: var(--dim);
    cursor: pointer; font-size: 14px; padding: 3px 6px; border-radius: 4px;
  }
  .tokenbtn:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .preview {
    font-size: 11px; font-style: italic; color: var(--dim);
    padding: 0 7px 4px; max-width: 340px; white-space: normal; line-height: 1.35;
  }
  .preview.err { color: var(--bad); font-style: normal; }
  .preview b { color: var(--accent); font-weight: 600; font-style: normal; }

  .tokenmenu {
    position: fixed; z-index: 60; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px; padding: 5px;
    box-shadow: 0 12px 32px #0006; max-width: 430px; max-height: 60vh; overflow: auto;
  }
  .tokenmenu button {
    display: block; width: 100%; text-align: left; border: none; background: none;
    color: var(--text); font: inherit; padding: 6px 9px; border-radius: 6px; cursor: pointer;
  }
  .tokenmenu button:hover { background: color-mix(in srgb, var(--accent) 15%, transparent); }
  .tokenmenu code { color: var(--accent); font-size: 12px; }
  .tokenmenu small { display: block; color: var(--dim); font-size: 11px; margin-top: 1px; }

  .soundlist { padding: 8px; max-height: 62vh; overflow: auto; }
  .sound-opt {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    border: 1px solid transparent; border-radius: 7px; background: none;
    color: var(--text); font: inherit; padding: 6px 9px; cursor: pointer;
  }
  .sound-opt:hover { border-color: var(--line); }
  .sound-opt[aria-current="true"] { border-color: var(--accent); }
  .sound-opt .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .sound-opt .detail { color: var(--dim); font-size: 11px; }

  .rowacts { white-space: nowrap; }
  .rowdel, .rowdup {
    border: none; background: none; color: var(--dim); cursor: pointer;
    font-size: 15px; padding: 4px 8px; visibility: hidden;
  }
  tbody tr:hover .rowdel, tbody tr:hover .rowdup { visibility: visible; }
  .rowdel:hover { color: var(--bad); }
  .rowdup:hover { color: var(--accent); }

  dialog {
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
    color: var(--text); padding: 0; max-width: 760px; width: 92vw;
  }
  dialog::backdrop { background: #0009; }
  .dlg-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .dlg-head h2 { margin: 0; font-size: 14px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 10px; padding: 16px; max-height: 66vh; overflow: auto; }
  .art-opt { border: 2px solid transparent; border-radius: 9px; padding: 5px; background: none; color: var(--text); cursor: pointer; font: inherit; }
  .art-opt:hover { border-color: var(--line); }
  .art-opt[aria-current="true"] { border-color: var(--accent); }
  .art-opt img, .art-opt .none {
    width: 100%; aspect-ratio: 1; border-radius: 6px; display: block; object-fit: cover;
  }
  .art-opt .none { border: 1px dashed var(--line); display: grid; place-items: center; color: var(--dim); }
  .art-opt small { display: block; margin-top: 4px; color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
  .hint { color: var(--dim); font-size: 12px; }

  /* ---------------------------------------------------------------------
     DRAFT COPY — a placeholder staged so a feature could be tested, still
     waiting to be written. Amber rather than red: nothing is BROKEN, the
     line just isn't yours yet. It is a different amber from --dirty (an
     unsaved edit) on purpose — the two say opposite things about a row, and
     one shade for both would make "I changed this" and "this is not mine"
     indistinguishable at a glance.

     The stripe is on the row and the badge is on the offending cell, so a
     table you are scrolling answers "which rows" and a row you have reached
     answers "which words".                                              */
  tr.draft > td:first-child { box-shadow: inset 3px 0 0 var(--draft); }
  td.draft .cell {
    border-color: var(--draft);
    background: color-mix(in srgb, var(--draft) 10%, var(--field));
  }
  /* The mark goes in the ID cell, NOT over the copy cell. A badge floated on
     top of the field covered the end of the very line it was pointing at —
     "Lorem ipsum dolor sit amet consNEEDS YOUR WORDS" — and padding the field
     to clear it only moves the collision to the next line long enough to
     reach. The id cell is sticky, so the mark also survives scrolling right,
     which the badge did not. The words themselves live in the tooltip and on
     the toolbar chip, where nothing has to make room for them. */
  tr.draft > td:first-child { position: relative; }
  tr.draft > td:first-child::after {
    content: "\270e";
    position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
    pointer-events: none; font-size: 12px; color: var(--draft);
  }
  tr.draft > td:first-child .cell { padding-right: 20px; }
  /* The count, in the toolbar, so the number is visible from any table —
     including the ones whose drafts are in a table you are not looking at. */
  /* Two chips, two different jobs, deliberately two different colours.
     Amber is a PLACEHOLDER — rare, urgent, and blocking a ship. Slate is the
     review backlog — 637 lines that already ship and are already fine, and
     want your eye at your own pace. One colour for both would make an urgent
     handful indistinguishable from a long, calm list. */
  #draftCount, #reviewCount {
    display: none; align-items: center; gap: 6px; cursor: pointer;
    border: 1px solid currentColor; border-radius: 999px;
    padding: 3px 10px; font-size: 12px; font-weight: 600;
    background: transparent;
  }
  #draftCount { color: var(--draft); }
  #reviewCount { color: var(--review); font-weight: 500; }
  #draftCount.on { background: color-mix(in srgb, var(--draft) 18%, transparent); }
  #reviewCount.on { background: color-mix(in srgb, var(--review) 20%, transparent); }
  #draftCount.show, #reviewCount.show { display: inline-flex; }
  #draftCount:disabled, #reviewCount:disabled { cursor: default; opacity: .6; }

  /* The review column itself, dimmed while it is still TRUE so a table you
     scroll shows the backlog draining down the right-hand edge as you clear
     it. No row stripe: every row starts flagged, and a stripe on all 637
     would say exactly as much as a stripe on none. */
  td.review-on .cell { color: var(--review); }
  td.review-off .cell { opacity: .45; }
</style>

<header>
  <select id="tableSel" aria-label="Which table"></select>
  <span id="dirtyElse"></span>
  <div class="grow"></div>
  <input type="search" id="filter" placeholder="Filter rows…" autocomplete="off">
  <button id="draftCount" type="button" title="Show only the rows still waiting for your words"></button>
  <button id="reviewCount" type="button" title="Show only the lines you have not signed off yet"></button>
  <button class="action" id="addRow" hidden>+ Add row</button>
  <button class="action" id="revert" disabled>Revert</button>
  <button class="action primary" id="save" disabled>Save</button>
</header>

<p class="blurb" id="blurb"></p>
<p class="status" id="status"></p>
<div class="scroller"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
<!-- Written by applyColWidths, one rule per column you have resized. A
     stylesheet rather than inline widths on every cell: the widths then
     survive renderBody without being re-applied to a thousand fresh <td>s. -->
<style id="colw"></style>

<dialog id="artDlg">
  <div class="dlg-head">
    <h2>Card art</h2>
    <span class="hint" id="artFor"></span>
    <div class="grow"></div>
    <button class="action" onclick="artDlg.close()">Close</button>
  </div>
  <div class="gallery" id="gallery"></div>
</dialog>

<dialog id="soundDlg">
  <div class="dlg-head">
    <h2>Sound</h2>
    <span class="hint" id="soundFor"></span>
    <div class="grow"></div>
    <input type="search" id="soundFilter" placeholder="Filter…" autocomplete="off">
    <button class="action" onclick="soundDlg.close()">Close</button>
  </div>
  <div class="soundlist" id="soundlist"></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
let tables = [];      // as served, plus a pristine copy for dirty/revert
let active = 0;
let sortCol = null, sortDir = 1;
let draftOnly = false;   // the amber chip: rows still holding a placeholder
let reviewOnly = false;  // the slate chip: lines not yet signed off
let art = null;       // key -> {label, src}, fetched on first use

const T = () => tables[active];
const clone = (v) => JSON.parse(JSON.stringify(v));

boot();

// The rule for "this is still a placeholder", handed over by the server as a
// pattern rather than an answer: cells are re-tested as they are typed, so the
// flag clears the moment the lorem is gone rather than at the next save. One
// definition, in tools/draft-copy.mjs, shared with the ship gate.
let draftRe = null;
const isDraft = (v) => !!draftRe && draftRe.test(String(v ?? ''));

// A row is a draft if any column a player READS still holds a placeholder.
// `notes` never counts — that is where the brief for the line is written.
function rowIsDraft(t, i) {
  return t.columns.some((c) => c.copy && isDraft(t.rows[i][c.name]));
}
const draftsIn = (t) => t.rows.reduce((n, _, i) => n + (rowIsDraft(t, i) ? 1 : 0), 0);

// The review backlog. Stored in the row rather than derived from it, because
// "has Ethan read this and kept it" is a fact about a person and there is
// nothing in the words to read it off. TRUE while it waits, blank once it is
// his — so a row he adds himself is confirmed by default.
const needsReview = (t, i) =>
  t.columns.some((c) => c.review) &&
  String(t.rows[i].review ?? '').trim().toLowerCase() === 'true';
const reviewsIn = (t) => t.rows.reduce((n, _, i) => n + (needsReview(t, i) ? 1 : 0), 0);

async function boot() {
  const r = await fetch('/api/tables');
  const data = await r.json();
  draftRe = new RegExp(data.draftPattern, 'i');
  // `origIndex` is what each live row was when the page loaded, so the "this
  // cell changed" highlight survives a row being inserted or deleted above it.
  // Comparing by POSITION instead paints every row below an insert as edited,
  // which is the one thing that highlight must never lie about.
  tables = data.tables.map((t) => ({ ...t, original: clone(t.rows), origIndex: t.rows.map((_, i) => i) }));
  renderTabs();
  renderTable();

  // Thumbnails are the entire reason the card art column is worth clicking, so
  // they load in the background rather than waiting for the picker to open —
  // half a megabyte of base64 over localhost, once.
  loadArt().catch(() => {});
  loadSounds().catch(() => {});

  $('tableSel').onchange = (e) => {
    active = Number(e.target.value);
    sortCol = null;
    renderTabs(); renderTable();
  };
  $('filter').oninput = renderBody;
  $('draftCount').onclick = () => {
    draftOnly = !draftOnly;
    $('draftCount').classList.toggle('on', draftOnly);
    renderBody();
  };
  $('reviewCount').onclick = () => {
    reviewOnly = !reviewOnly;
    $('reviewCount').classList.toggle('on', reviewOnly);
    renderBody();
  };
  $('save').onclick = save;
  $('revert').onclick = revert;
  $('addRow').onclick = addRow;
  addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); save(); }
  });
}

// No "unsaved changes" prompt when you switch: each table keeps its own edits
// in the page, so switching away loses nothing and confirming it would be a
// dialog about a non-event. The picker carries the marker instead — an edit
// left unsaved on a table you have navigated away from stays visible from here.
function renderTabs() {
  const sel = $('tableSel');
  sel.innerHTML = '';
  tables.forEach((t, i) => {
    const o = document.createElement('option');
    o.value = i;
    const d = draftsIn(t), rv = reviewsIn(t);
    // Both counts ride in the option itself, so a table with lines waiting
    // says so from the CLOSED picker — you find them without opening eleven
    // tables to look. The backlog shows as a fraction because "12" alone
    // reads as bad news on a table of 12 and as nearly done on one of 261.
    o.textContent = `${t.label}  \u00b7  ${t.rows.length}`
      + (d ? `  \u270e ${d}` : '')
      + (rv ? `  \u25cb ${rv}/${t.rows.length}` : '')
      + (dirtyOf(t) ? '  \u2022' : '');
    sel.append(o);
  });
  sel.value = active;

  // The toolbar chip counts THIS table (which is what the filter acts on) and
  // names the others, the same way the unsaved marker does — a bare total
  // would send you hunting, which is the thing the marker exists to stop.
  const here = draftsIn(T());
  const elsewhere = tables.reduce((n, t, i) => n + (i === active ? 0 : draftsIn(t)), 0);
  const chip = $('draftCount');
  chip.classList.toggle('show', here + elsewhere > 0);
  chip.textContent = here
    ? `\u270e ${here} need${here === 1 ? 's' : ''} your words`
    : `\u270e ${elsewhere} elsewhere`;
  chip.disabled = !here;
  chip.title = here
    ? 'Show only the rows still holding a placeholder'
    : `No placeholders in this table \u2014 ${elsewhere} in ${tables.filter((t, i) => i !== active && draftsIn(t)).map((t) => t.label).join(', ')}`;
  // Deliberately does NOT re-render the body. The last draft stops being one
  // the instant you finish typing the line, and a row vanishing out from under
  // the cursor mid-sentence is worse than a filter that quietly turns itself
  // off and leaves what you are writing where it is.
  if (!here && draftOnly) { draftOnly = false; chip.classList.remove('on'); }

  // The review chip, same shape as the draft one and deliberately quieter.
  const rHere = reviewsIn(T());
  const rAll = tables.reduce((n, t) => n + reviewsIn(t), 0);
  const rChip = $('reviewCount');
  rChip.classList.toggle('show', rAll > 0);
  rChip.textContent = rHere
    ? `\u25cb ${rHere} of ${T().rows.length} unread`
    : (rAll ? `\u25cb ${rAll} elsewhere` : '');
  rChip.disabled = !rHere;
  rChip.title = rHere
    ? 'Show only the lines you have not signed off yet \u2014 clear a row by setting its review cell to "yours"'
    : `Every line in this table is yours \u2014 ${rAll} still unread in other tables`;
  if (!rHere && reviewOnly) { reviewOnly = false; rChip.classList.remove('on'); }

  // Which OTHER tables are dirty. Named rather than counted: "2 unsaved" sends
  // you hunting through eleven options, and the whole point of the marker is
  // that you stop needing to.
  const others = tables.filter((t, i) => i !== active && dirtyOf(t)).map((t) => t.label);
  sel.classList.toggle('elsewhere', others.length > 0);
  $('dirtyElse').textContent = others.length ? `• unsaved in ${others.join(', ')}` : '';
}

function renderTable() {
  const t = T();
  $('blurb').textContent = t.blurb;
  $('addRow').hidden = !t.addRows;
  status('');
  renderHead();
  renderBody();
  applyColWidths();
  markDirty();
}

function renderHead() {
  const tr = document.createElement('tr');
  T().columns.forEach((c, n) => {
    const th = document.createElement('th');
    if (c.key) th.className = 'sticky';
    th.textContent = c.name;
    if (sortCol === c.name) th.insertAdjacentHTML('beforeend', `<span class="arrow"> ${sortDir > 0 ? '▲' : '▼'}</span>`);
    let tip = c.doc || '';
    if (c.blank) tip += `\nBlank = ${c.blank}.`;
    if (c.type === 'number' && c.min !== undefined) tip += `\nMinimum ${c.min}${c.integer ? ', whole numbers' : ''}.`;
    if (tip) th.title = tip.trim();
    th.onclick = () => {
      // A drag that ends over the header is still a mouseup on the <th>, and
      // without this every resize would also re-sort the table under you.
      if (justResized) return;
      sortDir = sortCol === c.name ? -sortDir : 1;
      sortCol = c.name;
      renderHead(); renderBody(); applyColWidths();
    };
    th.append(makeGrip(c, n));
    tr.append(th);
  });
  if (T().addRows) tr.append(document.createElement('th'));
  $('thead').replaceChildren(tr);
}

// ---------------------------------------------------------------------------
// COLUMN WIDTHS
//
// Kept per FILE and per COLUMN NAME, not per position: sorting reorders rows
// and a column added to a CSV later shifts every index after it, and a width
// that silently moved to the neighbouring column would be worse than no width
// at all. Position is only used at the moment the rule is written.
//
// In localStorage because it is a preference about looking, not data about the
// game — nothing here ever reaches a CSV.
// ---------------------------------------------------------------------------
const WIDTH_KEY = 'svCsvColWidths';
const MIN_COL = 56;

let colWidths = (() => {
  try { return JSON.parse(localStorage.getItem(WIDTH_KEY)) || {}; } catch { return {}; }
})();
let justResized = false;

function saveColWidths() {
  try { localStorage.setItem(WIDTH_KEY, JSON.stringify(colWidths)); } catch { /* private window; the widths just don't persist */ }
}

// THE WIDTH GOES ON THE CONTROL, NOT ON THE CELL. This table is auto-layout,
// where a `width` on a <td> is a suggestion the browser is free to ignore and
// a `max-width` on one is undefined behaviour — setting both collapsed every
// resized column to the width of its header text, which is the opposite of
// what was asked for. What already works here is `.w-text`, `.w-num` and the
// rest, which size the input and let the column follow it. So this overrides
// exactly those, and inherits their reliability.
function applyColWidths() {
  const mine = colWidths[T().file] ?? {};
  const rules = [];
  T().columns.forEach((c, n) => {
    const w = mine[c.name];
    if (!w) return;
    rules.push(`.scroller tbody td:nth-child(${n + 1}) .cell { width: ${w}px; }`);
  });
  $('colw').textContent = rules.join('\n');
}

function makeGrip(c, n) {
  const g = document.createElement('div');
  g.className = 'grip';
  g.title = `Drag to resize "${c.name}" — double-click to reset`;

  g.onpointerdown = (e) => {
    e.preventDefault();
    e.stopPropagation(); // never reaches the th, so a drag is not also a sort
    const startX = e.clientX;
    // Measured off a real control rather than off the header cell: the width
    // being written lands on the control, and the first and last columns carry
    // 16px of gutter padding on the cell around it — starting from the header
    // would jump the column by that gutter on the first pixel of the drag.
    const probe = document.querySelector(`.scroller tbody td:nth-child(${n + 1}) .cell`);
    const startW = (probe ?? g.parentElement).getBoundingClientRect().width;
    g.setPointerCapture(e.pointerId);
    g.classList.add('dragging');
    document.body.classList.add('resizing');

    const move = (ev) => {
      const w = Math.max(MIN_COL, Math.round(startW + (ev.clientX - startX)));
      (colWidths[T().file] ??= {})[c.name] = w;
      applyColWidths();
    };
    const up = () => {
      g.releasePointerCapture(e.pointerId);
      g.classList.remove('dragging');
      document.body.classList.remove('resizing');
      g.removeEventListener('pointermove', move);
      g.removeEventListener('pointerup', up);
      saveColWidths();
      // Cleared on the next tick, after the click this pointerup is about to
      // synthesise has already been swallowed by the th handler.
      justResized = true;
      setTimeout(() => { justResized = false; }, 0);
    };
    g.addEventListener('pointermove', move);
    g.addEventListener('pointerup', up);
  };

  g.ondblclick = (e) => {
    e.stopPropagation();
    delete colWidths[T().file]?.[c.name];
    saveColWidths();
    applyColWidths();
  };
  return g;
}

// The view is sorted and filtered; the FILE is not. Save always writes rows in
// their original order, so sorting a column to compare it never turns into a
// hundred-line reshuffle in the diff.
function visibleRows() {
  const t = T();
  const q = $('filter').value.trim().toLowerCase();
  let idx = t.rows.map((_, i) => i);
  if (q) idx = idx.filter((i) => Object.values(t.rows[i]).some((v) => String(v).toLowerCase().includes(q)));
  if (draftOnly) idx = idx.filter((i) => rowIsDraft(t, i));
  if (reviewOnly) idx = idx.filter((i) => needsReview(t, i));
  if (sortCol) {
    const num = t.columns.find((c) => c.name === sortCol)?.type === 'number';
    idx.sort((a, b) => {
      const x = t.rows[a][sortCol] ?? '', y = t.rows[b][sortCol] ?? '';
      if (num) {
        const nx = x === '' ? Infinity : Number(x), ny = y === '' ? Infinity : Number(y);
        return (nx - ny) * sortDir;
      }
      return String(x).localeCompare(String(y)) * sortDir;
    });
  }
  return idx;
}

function renderBody() {
  const t = T();
  const frag = document.createDocumentFragment();
  for (const i of visibleRows()) {
    const tr = document.createElement('tr');
    tr.dataset.row = i;
    tr.classList.toggle('draft', rowIsDraft(t, i));
    t.columns.forEach((c) => tr.append(cellFor(c, i)));
    if (t.addRows) {
      const td = document.createElement('td');
      td.className = 'rowacts';

      const dup = document.createElement('button');
      dup.className = 'rowdup'; dup.textContent = '⧉'; dup.title = 'Duplicate this row';
      dup.onclick = () => duplicateRow(i);

      const b = document.createElement('button');
      b.className = 'rowdel'; b.textContent = '✕'; b.title = 'Delete this row';
      b.onclick = () => {
        if (!confirm(`Delete "${t.rows[i].id || 'this row'}"?`)) return;
        t.rows.splice(i, 1);
        t.origIndex.splice(i, 1);
        renderTabs(); renderBody(); markDirty();
      };

      td.append(dup, b);
      tr.append(td);
    }
    frag.append(tr);
  }
  $('tbody').replaceChildren(frag);
}

function cellFor(c, i) {
  const t = T();
  const td = document.createElement('td');
  if (c.key) td.className = 'sticky';
  if (c.type === 'number') td.className += ' num';

  const set = (v) => {
    t.rows[i][c.name] = v;
    paint(td, c, i);
    markDirty();
  };

  let el;
  if (c.type === 'enum') {
    el = document.createElement('select');
    el.className = 'cell w-enum';
    for (const o of c.options) {
      const opt = document.createElement('option');
      opt.value = o;
      opt.textContent = c.labels?.[o] ?? o;
      el.append(opt);
    }
    el.value = c.options.includes(t.rows[i][c.name]) ? t.rows[i][c.name] : t.rows[i][c.name] || '';
    el.onchange = () => set(el.value);
  } else if (c.type === 'art') {
    el = document.createElement('button');
    el.className = 'cell artbtn w-art';
    el.onclick = () => openArt(c, i);
    paintArt(el, t.rows[i][c.name]);
  } else if (c.type === 'multi') {
    el = document.createElement('button');
    el.className = 'cell multibtn w-text';
    el.onclick = () => openMulti(el, c, i, set);
    paintMulti(el, c, t.rows[i][c.name]);
  } else if (c.type === 'sound') {
    el = document.createElement('button');
    el.className = 'cell soundbtn w-text';
    el.onclick = () => openSound(c, i);
    paintSound(el, t.rows[i][c.name]);
  } else {
    el = document.createElement('input');
    el.className = 'cell ' + (c.type === 'number' ? 'w-num' : c.key ? 'w-id' : c.wide ? 'w-wide' : 'w-text');
    el.value = t.rows[i][c.name] ?? '';
    el.placeholder = c.blank ? c.blank : '';
    if (c.readonly) { el.readOnly = true; el.title = c.doc || ''; }
    if (c.type === 'number') el.inputMode = 'decimal';
    if (c.type === 'combo') {
      // A dropdown you can also type into — the groups that exist are one
      // click away, and a brand new one is still just typing.
      const listId = `dl-${c.name}`;
      if (!document.getElementById(listId)) {
        const dl = document.createElement('datalist');
        dl.id = listId;
        for (const o of c.options) dl.insertAdjacentHTML('beforeend', `<option value="${o}">`);
        document.body.append(dl);
      }
      el.setAttribute('list', listId);
    }
    el.oninput = () => set(el.value);
    el.onkeydown = (e) => moveCell(e, td);
  }

  // A templated column gets the token menu and the resolved line underneath.
  // The preview is the whole point of a measured {effect}: you cannot read
  // "{effect}" and know whether the card will say 25% or 30%, so the editor
  // has to answer that while you are still typing.
  if (c.templated) {
    const wrap = document.createElement('div');
    wrap.className = 'tmpl';
    const row = document.createElement('div');
    row.className = 'tmpl-row';
    const tokens = document.createElement('button');
    tokens.className = 'tokenbtn';
    tokens.textContent = '⊕';
    tokens.title = 'Insert a {placeholder}';
    tokens.onclick = () => openTokens(tokens, el, set);
    const preview = document.createElement('div');
    preview.className = 'preview';
    row.append(el, tokens);
    wrap.append(row, preview);
    td.append(wrap);
    el.addEventListener('input', () => schedulePreview(td, c, i));
    schedulePreview(td, c, i);
    paint(td, c, i);
    return td;
  }

  td.append(el);
  paint(td, c, i);
  return td;
}

// Up/down walks a column, which is how you actually read these tables — you
// are comparing one creature's hp against the next, not filling a row in.
function moveCell(e, td) {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  const tr = td.parentElement;
  const col = [...tr.children].indexOf(td);
  const next = e.key === 'ArrowUp' ? tr.previousElementSibling : tr.nextElementSibling;
  const target = next?.children[col]?.querySelector('.cell');
  if (!target) return;
  e.preventDefault();
  target.focus();
  if (target.select) target.select();
}

function paint(td, c, i) {
  const o = T().origIndex[i];
  const raw = String(T().rows[i][c.name] ?? '');
  const was = o == null ? '' : String(T().original[o]?.[c.name] ?? '');
  td.classList.toggle('dirty', raw !== was);

  const err = validate(c, raw);
  td.classList.toggle('bad', !!err);

  // The placeholder flag, re-tested on every keystroke — so it clears as the
  // lorem is deleted rather than at the next save. The row's stripe follows
  // the cell, because a row is a draft exactly while one of its cells is.
  const draft = !!c.copy && isDraft(raw);
  td.classList.toggle('draft', draft);

  // The review cell carries its own state, so the column reads as a column of
  // ticks rather than a column of words you have to actually read.
  if (c.review) {
    const on = raw.trim().toLowerCase() === 'true';
    td.classList.toggle('review-on', on);
    td.classList.toggle('review-off', !on);
  }
  const tr = td.closest('tr');
  if (tr) tr.classList.toggle('draft', rowIsDraft(T(), i));

  const el = td.querySelector('.cell');
  if (el) {
    const hasNotes = T().columns.some((x) => x.name === 'notes');
    el.title = err
      || (draft
        ? 'A placeholder, not copy \u2014 write the real line here. '
          + (hasNotes ? 'The brief for it is in this row\u2019s notes column. ' : 'The brief for it is in design/COPY-TODO.md. ')
          + '`npm run ship` is blocked until it is gone.'
        : (c.doc || ''));
  }
}

// Mirrors parseNumber/parseBool in path/src/csvTable.js. Anything flagged here
// is something the game would warn about in the console and then ignore —
// which is exactly the class of mistake you want to see before you save, not
// after wondering why the megalodon kept its old hp.
function validate(c, raw) {
  const v = raw.trim();
  if (c.type === 'number') {
    if (v === '') return c.required ? 'This field has no default in the game — a blank cell keeps the config.js value and warns.' : '';
    const n = Number(v);
    if (!Number.isFinite(n)) return `"${raw}" isn't a number — the game will ignore this cell.`;
    if (c.min !== undefined && n < c.min) return `Must be at least ${c.min} — the game will ignore this cell.`;
    if (c.integer && !Number.isInteger(n)) return `Whole numbers only; the game floors this to ${Math.floor(n)}.`;
    return '';
  }
  if (c.type === 'multi') {
    // Exactly the warning bossNameTable.js prints at boot, moved to the cell:
    // a part tagged for an archetype that isn't there is loaded, kept, and
    // then never drawn — which is invisible from the file.
    const bad = splitList(v).filter((id) => !c.options.includes(id));
    if (!bad.length) return '';
    return `${bad.join(', ')} — not in ${c.source || 'the list'}, so this part will never appear.`;
  }
  if (c.key && v === '') return 'A row with no id is skipped entirely.';
  if (c.name === 'text' && v === '') return 'A quip with no text is ignored.';
  return '';
}

function addRow() {
  const t = T();
  const rec = {};
  t.header.forEach((h) => { rec[h] = ''; });
  t.rows.push(rec);
  t.origIndex.push(null);
  $('filter').value = '';
  sortCol = null;
  renderTabs(); renderHead(); renderBody(); markDirty();
  const last = $('tbody').lastElementChild?.querySelector('.cell');
  last?.focus();
}

// A near-copy of an existing row is how most of these tables actually grow: a
// second epithet for the same perk, another boss that differs only in sizeMul.
// The copy lands directly BELOW its source rather than at the bottom, because
// the reason you duplicated is that the two belong read together — in the
// editor and in the diff. Only the id is changed, and only because two rows
// with the same id is a row the game silently drops.
function duplicateRow(i) {
  const t = T();
  const rec = { ...t.rows[i] };
  if ('id' in rec) rec.id = uniqueId(t, rec.id);
  t.rows.splice(i + 1, 0, rec);
  t.origIndex.splice(i + 1, 0, null);
  renderTabs(); renderBody(); markDirty();
  // Straight into the new id: renaming it is the next thing you were going to
  // do, and `bossSharkCopy` is a placeholder, not a name.
  const cell = $('tbody').querySelector(`tr[data-row="${i + 1}"] .cell`);
  if (cell) { cell.focus(); cell.select?.(); }
}

function uniqueId(t, base) {
  // A copy of a copy counts up rather than stacking the word: duplicating
  // `squiddedCopy` gives `squiddedCopy2`, not `squiddedCopyCopy`.
  const raw = String(base ?? '').trim();
  const stem = raw.replace(/Copy\d*$/, '') || raw;
  if (!stem) return '';
  const taken = new Set(t.rows.map((r) => String(r.id ?? '').trim()));
  let id = `${stem}Copy`;
  for (let n = 2; taken.has(id); n++) id = `${stem}Copy${n}`;
  return id;
}

const dirtyOf = (t) => JSON.stringify(t.rows) !== JSON.stringify(t.original);
const isDirty = () => dirtyOf(T());

function markDirty() {
  const dirty = isDirty();
  renderTabs(); // so an unsaved edit on a table you've navigated away from still shows
  $('save').disabled = !dirty;
  $('revert').disabled = !dirty;
  const bad = document.querySelectorAll('td.bad').length;
  $('save').textContent = dirty ? (bad ? `Save (${bad} flagged)` : 'Save') : 'Saved';
}

function revert() {
  const t = T();
  if (!confirm('Throw away every change to this table since it loaded?')) return;
  t.rows = clone(t.original);
  t.origIndex = t.rows.map((_, i) => i);
  renderTabs(); renderBody(); markDirty();
  status('Reverted to what is on disk.');
}

async function save() {
  const t = T();
  if (!isDirty()) return;
  $('save').disabled = true;
  status('Saving…');
  try {
    const r = await fetch('/api/save', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ file: t.file, header: t.header, rows: t.rows, mtimeMs: t.mtimeMs }),
    });
    const out = await r.json();
    if (!r.ok) { status(out.error, 'bad'); markDirty(); return; }
    t.mtimeMs = out.mtimeMs;
    t.original = clone(t.rows);
    t.origIndex = t.rows.map((_, i) => i);
    // What was changed is now what's on disk, so the highlight has to go —
    // cleared in place rather than by re-rendering, which would take the
    // caret out of the cell you were typing in. The `bad` flags stay: those
    // are about the value, not about whether it has been written down.
    document.querySelectorAll('td.dirty').forEach((td) => td.classList.remove('dirty'));
    markDirty();
    status(`Saved ${t.file}. The dev server picks it up on the next reload.`, 'ok');
  } catch (err) {
    status(String(err), 'bad');
    markDirty();
  }
}

function status(msg, kind = '') {
  const el = $('status');
  el.textContent = msg;
  el.className = 'status ' + kind;
}

// --- card art ---------------------------------------------------------------

function paintArt(btn, key) {
  const meta = art?.[key];
  btn.innerHTML = '';
  if (key && meta) {
    const img = document.createElement('img');
    img.src = meta.src;
    btn.append(img);
  } else {
    const sw = document.createElement('div');
    sw.className = 'swatch';
    btn.append(sw);
  }
  const label = document.createElement('span');
  label.textContent = key || 'plain card';
  if (!key) label.style.color = 'var(--dim)';
  btn.append(label);
}

async function loadArt() {
  if (art) return art;
  art = await (await fetch('/api/cardart')).json();
  // Thumbnails on the buttons only become possible once the gallery is loaded,
  // so repaint the column the first time it is opened.
  document.querySelectorAll('.artbtn').forEach((b) => {
    const row = +b.closest('tr').dataset.row;
    paintArt(b, T().rows[row].cardArt ?? '');
  });
  return art;
}

// --- cells that hold a LIST -------------------------------------------------
//
// `bosses` is one cell holding several archetype ids. A datalist could only
// ever offer them one at a time and then leave you maintaining the separator
// by hand — which is how "bossShark,bossOrca" gets written as a single id that
// matches nothing at all. The checklist owns the separator instead: it always
// writes back the single space bossNameTable.js canonicalises on, and it can
// only write ids that exist.

const splitList = (raw) => String(raw ?? '').trim().split(/[\s,]+/).filter(Boolean);

// Two chips and a count. The column is narrow and the popover is where "which
// ones exactly" gets answered; what the cell has to say at a glance is whether
// this part is narrowed at all, and roughly how far.
function paintMulti(btn, c, raw) {
  const ids = splitList(raw);
  btn.innerHTML = '';
  if (!ids.length) {
    const any = document.createElement('span');
    any.className = 'any';
    any.textContent = c.blankLabel || 'any';
    btn.append(any);
    return;
  }
  for (const id of ids.slice(0, 2)) {
    const chip = document.createElement('span');
    chip.className = 'chip' + (c.options.includes(id) ? '' : ' unknown');
    chip.textContent = id;
    btn.append(chip);
  }
  if (ids.length > 2) {
    const more = document.createElement('span');
    more.className = 'more';
    more.textContent = `+${ids.length - 2}`;
    btn.append(more);
  }
}

function openMulti(anchor, c, i, set) {
  document.querySelector('.multimenu')?.remove();
  const chosen = new Set(splitList(T().rows[i][c.name]));
  // An id already in the cell that the list doesn't offer — a renamed or
  // deleted archetype — still gets a row. It has to be visible to be
  // unchecked, and a picker that silently dropped it on the first click would
  // be editing the file behind your back.
  const extra = [...chosen].filter((id) => !c.options.includes(id));

  const menu = document.createElement('div');
  menu.className = 'multimenu';

  const write = () => {
    // Written in ROSTER order rather than click order, so two rows tagged for
    // the same pair read identically in the file and in the diff.
    const out = [...c.options, ...extra].filter((id) => chosen.has(id)).join(' ');
    set(out);
    paintMulti(anchor, c, out);
  };

  for (const id of [...c.options, ...extra]) {
    const label = document.createElement('label');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = chosen.has(id);
    box.onchange = () => { box.checked ? chosen.add(id) : chosen.delete(id); write(); };
    const nm = document.createElement('span');
    // Labelled in the list, bare in the cell: "crab — a crab" is what you need
    // while choosing and noise once chosen.
    nm.textContent = c.labels?.[id] ?? id;
    if (extra.includes(id)) {
      nm.className = 'unknown';
      nm.title = `Not in ${c.source || 'the list'} — this part will never appear.`;
    }
    label.append(box, nm);
    menu.append(label);
  }

  // Blank is a real answer, and unticking the last box by hand is a worse way
  // to say it than one button that says what it means.
  const sep = document.createElement('div');
  sep.className = 'sep';
  const clear = document.createElement('button');
  clear.className = 'clear';
  clear.textContent = `Clear — ${c.blankLabel || 'any'}`;
  clear.onclick = () => {
    chosen.clear();
    menu.querySelectorAll('input').forEach((b) => { b.checked = false; });
    write();
  };
  menu.append(sep, clear);

  // Stays open across clicks: picking more than one is the entire point, and a
  // menu that closed on the first tick would make the second one a re-open.
  document.body.append(menu);
  const r = anchor.getBoundingClientRect();
  menu.style.left = `${Math.min(r.left, innerWidth - menu.offsetWidth - 12)}px`;
  menu.style.top = `${Math.min(r.bottom + 4, innerHeight - menu.offsetHeight - 12)}px`;
  setTimeout(() => addEventListener('pointerdown', function away(e) {
    if (!menu.contains(e.target)) { menu.remove(); removeEventListener('pointerdown', away); }
  }), 0);
}

// --- sounds -----------------------------------------------------------------

let sounds = null;                  // [{key, kind, file, detail}]
let soundsByKey = new Map();
let audio = null;                   // one player, so a second preview cuts the first

async function loadSounds() {
  if (sounds) return sounds;
  const r = await fetch('/api/sounds');
  sounds = (await r.json()).sounds ?? [];
  soundsByKey = new Map(sounds.map((s) => [s.key, s]));
  document.querySelectorAll('.soundbtn').forEach((b) => {
    const row = +b.closest('tr').dataset.row;
    paintSound(b, T().rows[row].sfx ?? '');
  });
  return sounds;
}

function play(file) {
  if (!file) return;
  if (audio) { audio.pause(); audio = null; }
  audio = new Audio(`/api/sound?file=${encodeURIComponent(file.split('/').pop())}`);
  audio.play().catch(() => {});
}

function paintSound(btn, key) {
  const s = soundsByKey.get(key);
  btn.innerHTML = '';
  const name = document.createElement('span');
  name.className = 'nm';
  name.textContent = key || 'level-up';
  if (!key) name.style.color = 'var(--dim)';
  btn.append(name);
  if (s?.kind === 'synth') {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = 'synth';
    tag.title = 'Generated in the browser — nothing to preview here.';
    btn.append(tag);
  } else if (s?.file) {
    const p = document.createElement('span');
    p.className = 'playbtn';
    p.textContent = '▶';
    p.title = `Play ${s.detail}`;
    // Not a nested <button> — this lives inside the cell button, and a button
    // in a button is invalid HTML that browsers silently unnest.
    p.onclick = (e) => { e.stopPropagation(); play(s.file); };
    btn.append(p);
  }
}

async function openSound(c, i) {
  await loadSounds();
  const t = T();
  $('soundFor').textContent = t.rows[i].name || t.rows[i].id;
  const list = $('soundlist');
  const current = t.rows[i][c.name] || '';

  const draw = () => {
    const q = $('soundFilter').value.trim().toLowerCase();
    list.innerHTML = '';
    const rows = [{ key: '', kind: 'none', detail: 'the shared level-up sound' }, ...sounds]
      .filter((s) => !q || s.key.toLowerCase().includes(q) || (s.detail || '').toLowerCase().includes(q));
    for (const s of rows) {
      const b = document.createElement('button');
      b.className = 'sound-opt';
      b.setAttribute('aria-current', current === s.key);
      b.innerHTML = `<span class="nm">${s.key || '— none'}</span><span class="detail">${s.detail ?? ''}</span>`;
      if (s.file) {
        const p = document.createElement('span');
        p.className = 'playbtn';
        p.textContent = '▶';
        p.onclick = (e) => { e.stopPropagation(); play(s.file); };
        b.append(p);
      } else if (s.kind === 'synth') {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = 'synth';
        b.append(tag);
      }
      b.onclick = () => {
        t.rows[i][c.name] = s.key;
        $('soundDlg').close();
        renderBody();
        markDirty();
      };
      list.append(b);
    }
  };

  $('soundFilter').oninput = draw;
  $('soundFilter').value = '';
  draw();
  $('soundDlg').showModal();
}

let tokenDefs = null;

async function openTokens(anchor, input, set) {
  if (!tokenDefs) tokenDefs = (await (await fetch('/api/tokens')).json()).tokens ?? [];
  document.querySelector('.tokenmenu')?.remove();
  if (!tokenDefs.length) return;

  const menu = document.createElement('div');
  menu.className = 'tokenmenu';
  for (const t of tokenDefs) {
    const b = document.createElement('button');
    b.innerHTML = `<code></code><small></small>`;
    b.querySelector('code').textContent = t.token;
    b.querySelector('small').textContent = t.help;
    b.onclick = () => {
      // Inserted at the caret, so a token can be dropped into the middle of a
      // sentence rather than only appended to it.
      const at = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? at;
      input.value = input.value.slice(0, at) + t.token + input.value.slice(end);
      const caret = at + t.token.length;
      set(input.value);
      input.focus();
      input.setSelectionRange(caret, caret);
      menu.remove();
    };
    menu.append(b);
  }
  document.body.append(menu);
  const r = anchor.getBoundingClientRect();
  menu.style.left = `${Math.min(r.left, innerWidth - menu.offsetWidth - 12)}px`;
  menu.style.top = `${Math.min(r.bottom + 4, innerHeight - menu.offsetHeight - 12)}px`;
  setTimeout(() => addEventListener('pointerdown', function away(e) {
    if (!menu.contains(e.target)) { menu.remove(); removeEventListener('pointerdown', away); }
  }), 0);
}

// Debounced per cell: the preview measures an upgrade by running its apply(),
// and doing that on every keystroke of a sentence is a round trip per letter.
const previewTimers = new WeakMap();
function schedulePreview(td, c, i) {
  clearTimeout(previewTimers.get(td));
  previewTimers.set(td, setTimeout(() => renderPreview(td, c, i), 220));
}

async function renderPreview(td, c, i) {
  const out = td.querySelector('.preview');
  if (!out) return;
  const t = T();
  const raw = t.rows[i][c.name] ?? '';
  // Nothing to resolve: the cell already reads as what the card will say.
  if (!raw.includes('{')) { out.textContent = ''; out.className = 'preview'; return; }

  try {
    const r = await fetch('/api/preview', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: t.rows[i].id, desc: raw, maxStacks: t.rows[i].maxStacks }),
    });
    const data = await r.json();
    if (data.available === false) {
      out.textContent = 'start with `npm run csv` to preview {placeholders}';
      out.className = 'preview';
      return;
    }
    if (data.error) { out.textContent = data.error; out.className = 'preview err'; return; }
    out.className = data.warnings?.length ? 'preview err' : 'preview';
    out.innerHTML = '';

    const line = (label, text) => {
      const d = document.createElement('div');
      d.append(label);
      const b = document.createElement('b');
      b.textContent = text;
      d.append(b);
      out.append(d);
    };
    line('1st card: ', data.text);
    // Only when the two ends actually read differently — on a card whose text
    // doesn't move with its stack, a second identical line is noise.
    if (data.later) line(data.capped ? `at max (${data.laterStack}): ` : `at ${data.laterStack}: `, data.later);

    for (const w of data.warnings ?? []) {
      const d = document.createElement('div');
      d.textContent = w.replace(/^\[upgrades\]\s*/, '');
      out.append(d);
    }
    if (data.stale) {
      out.className = 'preview err';
      const d = document.createElement('div');
      d.textContent = `⚠ ${data.stale}`;
      out.append(d);
    }
  } catch (err) {
    out.textContent = String(err);
    out.className = 'preview err';
  }
}

async function openArt(c, i) {
  await loadArt();
  const t = T();
  $('artFor').textContent = `${t.rows[i].name || t.rows[i].id}`;
  const g = $('gallery');
  g.innerHTML = '';
  for (const key of c.options) {
    const b = document.createElement('button');
    b.className = 'art-opt';
    b.setAttribute('aria-current', (t.rows[i][c.name] || '') === key);
    if (key && art[key]) {
      b.innerHTML = `<img src="${art[key].src}" alt=""><small>${key}</small>`;
    } else {
      b.innerHTML = `<div class="none">none</div><small>plain card</small>`;
    }
    b.onclick = () => {
      t.rows[i][c.name] = key;
      $('artDlg').close();
      renderBody();
      markDirty();
    };
    g.append(b);
  }
  $('artDlg').showModal();
}
