<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fin twitch — the flick as each flipper throws</title>
    <style>
      html, body { margin: 0; background: #05070d; color: #cfe6ff;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #log { padding: 10px; white-space: pre-wrap; }
      .ok { color: #7fe6a0; } .bad { color: #ff8b7a; } .dim { color: #5d7a9e; }
      h2 { margin: 20px 10px 2px; font-size: 13px; letter-spacing: .12em;
           text-transform: uppercase; color: #6f8fb8; font-weight: 600; }
      h2 span { text-transform: none; letter-spacing: 0; color: #4d6b8f; }
      .row { display: grid; gap: 6px; padding: 4px 10px 10px;
             grid-template-columns: repeat(8, 1fr); }
      .row.wide { grid-template-columns: repeat(4, 1fr); }
      .cell { background: #070b14; border: 1px solid #16233a; border-radius: 5px; overflow: hidden; }
      .cell.peak { border-color: #d8a13f; box-shadow: 0 0 0 1px #6b4a12 inset; }
      .cell canvas { display: block; width: 100%; height: auto; }
      .cap { padding: 5px 6px 7px; color: #7f9dc4; font-size: 11px; }
      .cap b { color: #cfe6ff; font-weight: 600; }
      .cap .tag { color: #ffc46b; }
    </style>
  </head>
  <body>
    <div id="log"></div>
    <div id="sheet"></div>
    <script type="module" src="./fin-twitch.js"></script>
  </body>
</html>
