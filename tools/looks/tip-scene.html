<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tip in the water — the label, the pulse and the dissolve</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #04121e;
        color: #cfe6ff; font: 13px/1.45 'Inter', ui-sans-serif, system-ui, sans-serif; }
      /* Standing in for the arena. The real thing is a lit 3D scene; what
         matters for judging a LABEL is that the water is dark, the pickups are
         bright, and there is more than one of them — the whole question a tip
         beside its subject answers is "which of these do you mean". */
      #sea { position: fixed; inset: 0; background:
        linear-gradient(180deg, #0e4a6b 0%, #07253d 45%, #041420 100%); }
      .orb { position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
        will-change: transform, box-shadow, background; }
      #note { position: fixed; left: 14px; top: 12px; z-index: 20; max-width: 460px; }
      #note h1 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
        color: #7ad7ff; font-weight: 600; margin: 0 0 6px; }
      #note p { color: #8fb3d8; margin: 0 0 6px; }
      #note b { color: #cfe6ff; font-weight: 600; }
      #phase { color: #ffc65a; }
      #style { position: fixed; right: 14px; top: 12px; z-index: 20; display: flex; gap: 6px; }
      #style button { background: #0d3b57; color: #cfe6ff; border: 1px solid #1d5c7f;
        border-radius: 4px; padding: 5px 10px; font: inherit; cursor: pointer; }
      #style button[data-on="1"] { background: #1d5c7f; border-color: #7ad7ff; }
    </style>
  </head>
  <body>
    <div id="sea"></div>
    <div id="note">
      <h1>A tip in the water</h1>
      <p>The real <b>ui/callout.js</b> and <b>systems/telegraph.js</b>, over a stand-in
         ocean. Four bubbles drift up; the coach is talking about <b>one</b> of
         them, and that one pulses while the label rides it. On collection the
         line holds the place the bubble was and dissolves.</p>
      <p id="phase"></p>
    </div>
    <div id="style"></div>
    <script type="module" src="./tip-scene.js"></script>
  </body>
</html>
