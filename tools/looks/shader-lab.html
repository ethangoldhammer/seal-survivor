<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Shader lab — banded shading and painted pattern on one animal</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #070d14; color: #cfe6ff;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
      body { display: flex; }

      /* --- the roster ------------------------------------------------------ */
      #list { width: 200px; flex: none; overflow-y: auto; border-right: 1px solid #16283c; padding: 8px 0; }
      #list input { width: calc(100% - 24px); margin: 0 12px 8px; background: #0d1a26;
        border: 1px solid #1e3b52; color: #cfe6ff; font: inherit; padding: 4px 6px; border-radius: 3px; }
      #list button { display: block; width: 100%; text-align: left; background: none; border: 0;
        color: #9dc0d2; padding: 5px 12px; font: inherit; cursor: pointer; }
      #list button:hover { background: #112433; color: #eaf6fc; }
      #list button.on { background: #1d4e68; color: #fff; }
      #list .group { color: #55738f; font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
        padding: 10px 12px 3px; border-top: 1px solid #142534; margin-top: 4px; }
      #list button .tag { color: #ffc46b; font-size: 10px; }

      /* --- the animal ------------------------------------------------------ */
      main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      #stageRow { display: flex; gap: 14px; padding: 14px; align-items: flex-start; }
      #stage { position: relative; border: 1px solid #16283c; cursor: grab; flex: none;
        background: linear-gradient(#0d2233, #061019); }
      #stage.drag { cursor: grabbing; }
      #stage canvas { display: block; width: 460px; height: 460px; }
      #stage .hint { position: absolute; left: 8px; bottom: 6px; color: #4d6b8f; font-size: 10px; }

      /* --- the controls ---------------------------------------------------- */
      #panels { flex: 1; min-width: 260px; max-width: 420px; display: grid; gap: 6px;
        align-content: start; max-height: calc(100vh - 28px); overflow-y: auto; }
      .sect { border: 1px solid #16283c; border-radius: 4px; }
      .sect > h3 { margin: 0; padding: 6px 9px; background: #0d1a26; font-size: 11px;
        letter-spacing: .1em; text-transform: uppercase; color: #7fa8c8; font-weight: 600;
        display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
      .sect > h3 .en { display: flex; align-items: center; gap: 5px; text-transform: none;
        letter-spacing: 0; color: #9dc0d2; font-size: 10px; }
      .sect > .body { padding: 7px 9px 9px; display: grid; gap: 6px; }
      .sect.shut > .body { display: none; }
      /* 92px, not 78: the two controls that decide whether a layer mixes with
         the model's photograph or replaces it need labels that say so, and at
         78 both of them wrapped to three lines. */
      .row { display: grid; grid-template-columns: 92px 1fr 50px; gap: 7px; align-items: center; }
      .row label { color: #82a9bc; font-size: 11px; }
      .row output { text-align: right; color: #cfe6f2; font-size: 11px; }
      .row select, .row input[type=text] { background: #0d1a26; border: 1px solid #1e3b52;
        color: #cfe6ff; font: inherit; font-size: 11px; padding: 2px 4px; border-radius: 3px; }
      input[type=range] { width: 100%; }
      /* The "this model cannot band" notice — a full-width amber line above the
         toon sliders, rather than a third column, because it is a sentence. */
      .warnrow { grid-template-columns: 92px 1fr; }
      .warnrow output { grid-column: 2; text-align: left; color: #ffc46b;
        font-size: 10px; line-height: 1.35; }
  .surf { display: grid; grid-template-columns: 16px 1fr; gap: 2px 7px; align-items: center;
    padding: 4px 2px; cursor: pointer; }
  .surf b { color: #cfe6ff; font-weight: 600; font-size: 11px; }
  .surf i { grid-column: 2; color: #6f92b4; font-style: normal; font-size: 10px; }
  .surf input { grid-row: span 2; }
  /* The switched-on layers, marked on the row itself: three checkboxes with
     nothing between them read as a list of options rather than as a statement
     of what this animal is currently wearing. */
  .surf:has(input:checked) b { color: #7fe6a0; }
  .surf:has(input:checked) { background: #0d1f22; border-radius: 3px; }

  /* The old picker's three choices, kept as shortcuts. Deliberately quieter
     than the record buttons below — these change what you are looking at, they
     do not write anything. */
  .combos .cols { flex-wrap: wrap; gap: 4px; }
  button.combo { background: #10222f; color: #9dc0d2; border: 1px solid #1e3b52;
    padding: 3px 7px; border-radius: 3px; cursor: pointer; font: inherit; font-size: 10px; }
  button.combo:hover { background: #1a3a4e; color: #eaf6fc; }

      .cols { display: flex; gap: 6px; align-items: center; }
      .cols input[type=color] { width: 34px; height: 22px; padding: 0; border: 1px solid #2b4b5c; }
      .btns { display: flex; gap: 7px; flex-wrap: wrap; padding: 2px 0 0; }
      button.act { background: #17455c; color: #dff0f8; border: 1px solid #2b6d8d;
        padding: 6px 11px; border-radius: 3px; cursor: pointer; font: inherit; font-size: 11px; }
      button.act:hover { background: #1e5a78; }
      button.act.warn { background: #5c3a17; border-color: #8d6a2b; }
      #status { color: #7fe6a0; font-size: 11px; min-height: 15px; padding: 0 14px; }
      #status.err { color: #ff8b7a; }
      /* A record that landed but has a caveat — the same amber the "cannot
         band" notice uses. Red here meant every noted success looked failed. */
      #status.warn { color: #ffc46b; }
      #notes { color: #6f92b4; font-size: 11px; padding: 2px 14px 12px; white-space: pre-wrap; }
      textarea { width: 100%; height: 120px; background: #0a1520; color: #bcd8ea;
        border: 1px solid #1e3b52; font: 11px/1.4 ui-monospace, monospace; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="list"></div>
    <main>
      <div id="stageRow">
        <div id="stage"><div class="hint">drag to orbit · wheel to zoom</div></div>
        <div id="panels"></div>
      </div>
      <div id="status"></div>
      <div id="notes"></div>
    </main>
    <script type="module" src="./shader-lab.js"></script>
  </body>
</html>
