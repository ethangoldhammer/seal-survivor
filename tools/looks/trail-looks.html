<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Breach trail — looks</title>
    <style>
      html, body { margin: 0; background: #05070d; color: #cfe6ff;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
      .cell { background: #070b14; border: 1px solid #16233a; border-radius: 6px; overflow: hidden; }
      .cell canvas { display: block; width: 100%; height: auto; }
      .cap { padding: 7px 9px 9px; }
      .cap b { color: #ffffff; font-size: 13px; letter-spacing: 0.02em; }
      .cap .why { color: #7f9dc4; margin-top: 3px; }
      .cap .p { color: #4d6party; }
      .cap code { color: #6fd3ff; font-size: 11px; }
      h1 { font-size: 14px; margin: 12px 12px 0; color: #fff; font-weight: 600; }
      h1 span { color: #7f9dc4; font-weight: 400; }
    </style>
  </head>
  <body>
    <h1>Breach trail — six looks <span id="sub"></span></h1>
    <div id="grid"></div>
    <script type="module" src="./trail-looks.js"></script>
  </body>
</html>
