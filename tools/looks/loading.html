<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Loading — cold boot vs resume</title>
    <!-- THE FONT SHELF, the same link index.html carries. The screen's two
         lines are Text panel roles now, so this page renders whatever family
         the tuning is set to — and without the shelf a vendored family falls
         back to a system face, which is a picture of a design nobody chose. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #060b14; }
      /* The two screens side by side. The whole question this page answers is
         whether a resumed boot reads as a DIFFERENT thing from a cold one, and
         that is not a question you can answer looking at either alone. */
      .pair { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
      .pane { position: relative; overflow: hidden; }
      .pane + .pane { border-left: 1px solid rgba(122,215,255,0.18); }
      /* showLoading() appends to document.body and is position:fixed, so each
         copy is given its own containing block to be fixed inside. */
      .pane { transform: translateZ(0); }
      .tag { position: absolute; z-index: 40; top: 10px; left: 12px;
        font: 500 11px/1 Inter, system-ui, sans-serif; letter-spacing: 0.08em;
        text-transform: uppercase; color: rgba(122,215,255,0.55); }
    </style>
  </head>
  <body>
    <div class="pair">
      <div class="pane" id="cold"><div class="tag">cold boot</div></div>
      <div class="pane" id="resume"><div class="tag">resumed</div></div>
    </div>
    <script type="module" src="./loading.js"></script>
  </body>
</html>
