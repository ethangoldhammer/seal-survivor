<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>The score card — the shipped screen, outside the game</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden;
        background: radial-gradient(120% 90% at 50% 10%, #14384f 0%, #061019 100%);
        color: #dff0ff; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #hud { position: fixed; left: 12px; top: 10px; z-index: 9; max-width: 40ch;
        text-shadow: 0 1px 3px rgba(0,0,0,.55); }
      #hud h1 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
        margin: 0 0 6px; color: #9fdcff; font-weight: 600; }
      #hud p { margin: 0 0 6px; color: #b9d6ee; }
      #hud button { font: inherit; margin: 0 4px 4px 0; padding: 4px 8px;
        background: #0d2233; color: #dff0ff; border: 1px solid #2c5b78; border-radius: 4px; cursor: pointer; }
      #say { color: #ffe08a; white-space: pre-wrap; }
    </style>
    <!-- The pane suspends rAF — see menu-screen.html for the whole story. The
         flip is driven by rAF, so without this the card never turns here. -->
    <script>
      if (!/[?&]raf=native/.test(location.search)) {
        window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
        window.cancelAnimationFrame = (id) => clearTimeout(id);
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <h1>Score card — ui.js</h1>
      <p>The real game-over card, with a seeded local board and a recorded run.</p>
      <button id="btnShow">re-open</button>
      <button id="btnFlip">scroll</button>
      <button id="btnMeasure">measure</button>
      <button id="btnBoard">menu board</button>
      <p id="say">…</p>
    </div>
    <script type="module" src="./score-card.js"></script>
  </body>
</html>
