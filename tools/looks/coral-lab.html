<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Coral lab — growing a species</title>
    <style>
      html, body { margin: 0; background: #05070d; color: #cfe6ff;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #log { padding: 10px; white-space: pre-wrap; }
      .ok { color: #7fe6a0; } .bad { color: #ff8b7a; }
      h2 { margin: 18px 10px 4px; font-size: 13px; letter-spacing: .12em;
           text-transform: uppercase; color: #6f8fb8; font-weight: 600; }
      h2 span { text-transform: none; letter-spacing: 0; color: #4d6b8f; }
      .row { display: grid; gap: 8px; padding: 4px 10px 10px; }
      .cell { background: #070b14; border: 1px solid #16233a; border-radius: 6px; overflow: hidden; }
      .cell canvas { display: block; width: 100%; height: auto; }
      .cap { padding: 6px 8px 8px; color: #7f9dc4; font-size: 11px; }
      .cap b { color: #cfe6ff; font-weight: 600; }

      /* --- THE BENCH ------------------------------------------------------
         The live half. Everything above it is a printed contact sheet the
         screenshot server can read off disk; this is what you actually drag.
         Laid out beside the specimen rather than under it, because the whole
         job here is watching one number change one silhouette. */
      .bench { display: grid; grid-template-columns: 360px 1fr; gap: 12px;
        padding: 4px 10px 20px; align-items: start; }
      .bench .stage { background: #070b14; border: 1px solid #16233a; border-radius: 6px;
        overflow: hidden; position: sticky; top: 10px; }
      .bench .stage canvas { display: block; width: 100%; height: auto; }
      .knobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 2px 14px; align-content: start; }
      .knob { display: grid; grid-template-columns: 1fr 96px 52px; align-items: center;
        gap: 8px; padding: 2px 0; }
      .knob label { color: #7f9dc4; font-size: 11px; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; }
      .knob input[type=range] { width: 100%; accent-color: #5ef2a8; }
      .knob output { color: #cfe6ff; text-align: right; font-variant-numeric: tabular-nums; }
      .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        padding: 8px 10px; }
      button, select { font: inherit; background: #10203a; color: #cfe6ff;
        border: 1px solid #234260; border-radius: 5px;
        padding: 5px 10px; cursor: pointer; }
      button:hover { background: #17304f; }
      pre.out { margin: 6px 10px 20px; padding: 10px; background: #070b14;
        border: 1px solid #16233a; border-radius: 6px; color: #9dc0e6;
        white-space: pre-wrap; word-break: break-word; max-height: 40vh; overflow: auto; }
    </style>
  </head>
  <body>
    <div id="log"></div>
    <div id="sheet"></div>
    <h2>The bench <span>— drag a number, watch the silhouette. Nothing here is saved.</span></h2>
    <div class="bar" id="bar"></div>
    <div class="bench">
      <div class="stage" id="stage"></div>
      <div class="knobs" id="knobs"></div>
    </div>
    <h2>Paste this into config.js <span>— the block as it stands on the bench</span></h2>
    <pre class="out" id="out"></pre>
    <script type="module" src="./coral-lab.js"></script>
  </body>
</html>
