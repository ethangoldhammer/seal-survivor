<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Without this the mobile preset lays out at 980px and the phone case
         never gets tested: the comb would report a row where the game gets a
         column. index.html has one; a look page that is checked at phone
         sizes needs the same one. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The level-up screen — the shipped menu, outside the game</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden;
        background: radial-gradient(120% 90% at 50% 20%, #1d4763 0%, #0a1c2a 70%, #050d15 100%);
        color: #dff0ff; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      /* Over the game's own .sv-ui, and it takes the pointer back: every other
         layer on this page is the shipped menu, which is pointer-events:none
         until it unlocks. */
      /* IT HAS TO SCROLL. Two groups of sliders over a screen that is often a
         laptop window turned landscape — 393px tall on a phone held sideways —
         and the panel is taller than that, so the last knobs were simply off
         the bottom with no way to reach them. */
      #panel { position: fixed; left: 12px; top: 10px; z-index: 99999;
        width: 290px; padding: 10px 12px 12px; pointer-events: auto;
        max-height: calc(100vh - 24px); overflow-y: auto; overscroll-behavior: contain;
        background: rgba(6,14,22,0.86); border: 1px solid rgba(122,215,255,0.25);
        border-radius: 8px; text-shadow: 0 1px 3px rgba(0,0,0,.55); }
      #panel h1 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
        margin: 0 0 6px; color: #9fdcff; font-weight: 600;
        display: flex; align-items: center; gap: 8px; }
      #panel h1 button { margin-left: auto; padding: 0 7px; }
      /* COLLAPSED IS A REAL STATE, not a convenience. The panel is 290px of
         controls over a screen that is the thing being looked at, and on a
         laptop-sized window it covers a third of the comb — including one of
         the three cards. */
      #panel.shut > *:not(h1) { display: none; }
      #panel.shut { width: auto; }
      #panel p { margin: 0 0 8px; color: #b9d6ee; }
      .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
      .row label { flex: 0 0 108px; color: #9fbdd6; }
      .row input[type=range] { flex: 1; min-width: 0; }
      .row output { flex: 0 0 44px; text-align: right; color: #ffe08a; }
      .btns { display: flex; gap: 6px; margin: 8px 0 6px; flex-wrap: wrap; }
      button { font: inherit; color: #dff0ff; background: rgba(122,215,255,0.12);
        border: 1px solid rgba(122,215,255,0.35); border-radius: 5px; padding: 3px 9px; cursor: pointer; }
      button:hover { background: rgba(122,215,255,0.22); }
      button[aria-pressed=true] { background: #7ad7ff; color: #06121c; }
      #read { color: #ffe08a; white-space: pre-wrap; margin-top: 8px; }
      hr { border: 0; border-top: 1px solid rgba(122,215,255,0.18); margin: 9px 0; }
      /* THE SEAL MOTION PANEL — see seal-motion-panel.js. */
      #sealMotion h2 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #9fdcff; margin: 4px 0 6px; }
      #sealMotion h3 { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #7f9ab0; margin: 8px 0 2px; }
      #sealMotion .sm-inline { display: inline-flex; align-items: center; gap: 4px; color: #9fbdd6; }
      #sealMotion select { font: inherit; color: #dff0ff; background: #0b1a27; border: 1px solid rgba(122,215,255,0.35); border-radius: 4px; }
      #sealMotion input[type=number] { font: inherit; color: #ffe08a; background: #0b1a27; border: 1px solid rgba(122,215,255,0.35); border-radius: 4px; }
      #smStrip { position: relative; height: 26px; margin: 6px 0 2px; border-radius: 4px; cursor: crosshair;
        background: linear-gradient(90deg, rgba(122,215,255,0.10), rgba(122,215,255,0.18)); border: 1px solid rgba(122,215,255,0.3); }
      .sm-key { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; background: #ffe08a;
        transform: rotate(45deg); cursor: ew-resize; border: 1px solid #06121c; }
      .sm-key.sel { background: #7ad7ff; box-shadow: 0 0 0 2px rgba(122,215,255,0.5); }
      .sm-head { position: absolute; top: 0; bottom: 0; width: 1px; margin-left: -0.5px; background: #ff7a7a; pointer-events: none; }
      #smNote { color: #7f9ab0; margin-top: 6px; white-space: pre-wrap; }
      #smOverlay { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 99998; pointer-events: none;
        font: 11px ui-monospace, Menlo, monospace; }
      #smOverlay .sm-handle { pointer-events: auto; cursor: grab; }
      #smOverlay .sm-handle circle { fill: rgba(122,215,255,0.18); stroke: #7ad7ff; stroke-width: 1.5; }
      #smOverlay .sm-handle text { fill: #dff0ff; pointer-events: none; }
      #smOverlay .sm-line { stroke: rgba(255,224,138,0.6); stroke-width: 1; stroke-dasharray: 4 3; }
    </style>
    <!-- NO rAF SHIM. The other look pages swap requestAnimationFrame for a
         setTimeout pump, because the agent's browser pane reports
         document.hidden and Chrome throttles rAF there to a stop. This screen
         has no rAF loop at all — the comb is CSS animations and the arrival is
         setTimeout, and neither is throttled the same way. A shim here would be
         a line nothing reads, which is worse than no line. -->
  </head>
  <body>
    <div id="panel">
      <h1>Level-up screen<button id="shut" aria-label="collapse the panel">–</button></h1>
      <p>The shipped menu, dealt on a fixed seed. <b>Scrub</b> replaces the
        clock, so any moment of the arrival can be held still and looked at.</p>
      <div class="btns">
        <button id="arrival">Arrival: slam</button>
        <a href="./level-up.html?compare=1" style="color:#7ad7ff">side by side ↗</a>
      </div>
      <div class="btns">
        <button id="roll">Roll</button>
        <button id="hand">New hand</button>
        <button id="skip">Skip</button>
        <button id="exit">Exit</button>
        <button id="changed">What I changed</button>
        <button id="live" aria-pressed="true">Live</button>
        <button id="scrubMode" aria-pressed="false">Scrub</button>
      </div>
      <div class="row"><label for="t">moment (s)</label><input id="t" type="range" min="0" max="1" step="0.001" value="0" /><output id="tOut">0.00</output></div>
      <hr />
      <div id="knobs"></div>
      <div id="read">nothing dealt yet</div>
    </div>
    <script type="module" src="./level-up.js"></script>
  </body>
</html>
