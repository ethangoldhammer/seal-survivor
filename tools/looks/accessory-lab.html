<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Accessory lab — place what the seal wears</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #070d14; color: #cfe6ff;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
      body { display: flex; }

      /* --- what is on the seal --------------------------------------------- */
      #list { width: 190px; flex: none; overflow-y: auto; border-right: 1px solid #16283c; padding: 10px 0; }
      #list .group { color: #55738f; font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
        padding: 4px 12px 6px; }
      #list button { display: block; width: 100%; text-align: left; background: none; border: 0;
        color: #9dc0d2; padding: 6px 12px; font: inherit; cursor: pointer; }
      #list button:hover { background: #112433; color: #eaf6fc; }
      #list button.on { background: #1d4e68; color: #fff; }
      #list button .tag { color: #ffc46b; font-size: 10px; }
      #list button .off { color: #55738f; font-size: 10px; }

      /* --- the viewport ---------------------------------------------------- */
      main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      #stageRow { display: flex; gap: 14px; padding: 14px; align-items: flex-start; }
      #stage { position: relative; border: 1px solid #16283c; flex: none;
        background: linear-gradient(#0d2233, #061019); }
      #stage canvas { display: block; }
      #stage .hint { position: absolute; left: 8px; bottom: 6px; color: #4d6b8f; font-size: 10px;
        pointer-events: none; }
      #stage .mode { position: absolute; right: 8px; top: 6px; color: #7fe6a0; font-size: 10px;
        pointer-events: none; letter-spacing: .06em; text-transform: uppercase; }

      /* --- the numbers ----------------------------------------------------- */
      #panels { flex: 1; min-width: 280px; max-width: 420px; display: grid; gap: 6px;
        align-content: start; max-height: calc(100vh - 28px); overflow-y: auto; }
      .sect { border: 1px solid #16283c; border-radius: 4px; }
      .sect > h3 { margin: 0; padding: 6px 9px; background: #0d1a26; font-size: 11px;
        letter-spacing: .1em; text-transform: uppercase; color: #7fa8c8; font-weight: 600; }
      .sect > .body { padding: 7px 9px 9px; display: grid; gap: 6px; }
      .row { display: grid; grid-template-columns: 104px 1fr 56px; gap: 7px; align-items: center; }
      .row label { color: #82a9bc; font-size: 11px; }
      .row output { text-align: right; color: #cfe6f2; font-size: 11px; }
      /* A field the gizmo or a slider has moved since the page loaded. Only
         these are written on save — see tools/apply-accessories.mjs — so the
         mark is not decoration, it is the list of what the button will do. */
      .row.moved label { color: #7fe6a0; }
      .row.moved label::after { content: ' •'; color: #7fe6a0; }
      .row select { background: #0d1a26; border: 1px solid #1e3b52; color: #cfe6ff;
        font: inherit; font-size: 11px; padding: 2px 4px; border-radius: 3px; }
      input[type=range] { width: 100%; }
      .chk { display: flex; align-items: center; gap: 7px; color: #82a9bc; font-size: 11px; }
      .btns { display: flex; gap: 7px; flex-wrap: wrap; padding: 2px 0 0; }
      button.act { background: #17455c; color: #dff0f8; border: 1px solid #2b6d8d;
        padding: 6px 11px; border-radius: 3px; cursor: pointer; font: inherit; font-size: 11px; }
      button.act:hover { background: #1e5a78; }
      button.act.quiet { background: #10222f; color: #9dc0d2; border-color: #1e3b52; }
      #status { color: #7fe6a0; font-size: 11px; min-height: 15px; padding: 0 14px; }
      #status.err { color: #ff8b7a; }
      #status.warn { color: #ffc46b; }
      #notes { color: #6f92b4; font-size: 11px; padding: 2px 14px 12px; white-space: pre-wrap; }
      .keys { color: #55738f; font-size: 10px; line-height: 1.6; padding: 2px 0 0; }
      .keys b { color: #9dc0d2; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="list"></div>
    <main>
      <div id="stageRow">
        <div id="stage">
          <div class="hint">drag to orbit · wheel to zoom · drag the handles to place</div>
          <div class="mode" id="modeTag">move</div>
        </div>
        <div id="panels"></div>
      </div>
      <div id="status"></div>
      <div id="notes"></div>
    </main>
    <script type="module" src="./accessory-lab.js"></script>
  </body>
</html>
