<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spline name screen — the audition</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden;
    font: 13px/1.5 'Inter', system-ui, sans-serif; color: #e8ecf3; }
  /* THE SAME CHECKER the Rive probe uses, and for the same question asked of a
     different file: whatever the Spline scene paints over this is opaque, and
     whatever shows through is a hole the game's own title seal could live in.
     The .riv turned out to be fully opaque (see splash-probe.js) — the point of
     the audition is partly whether this one is. */
  #under { position: absolute; inset: 0;
    background:
      repeating-conic-gradient(#ff00c8 0% 25%, #00e5ff 0% 50%) 0 0 / 64px 64px; }
  #stage { position: absolute; inset: 0; }
  #hud { position: absolute; left: 12px; bottom: 12px; z-index: 40; pointer-events: none;
    background: rgba(8,10,16,0.9); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 10px; padding: 8px 12px; white-space: pre; font-variant-numeric: tabular-nums;
    max-width: 46vw; }
</style>
<script>
  // The Browser pane reports document.hidden, so Chrome suspends rAF — and the
  // Spline runtime's whole render loop is requestAnimationFrame. Without this
  // the scene loads, paints nothing, and looks exactly like a scene that is
  // empty or a URL that is wrong. Gated so a real browser window uses the real
  // clock.
  if (!location.search.includes('raf=native')) {
    window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
    window.cancelAnimationFrame = (id) => clearTimeout(id);
  }
</script>
</head>
<body>
  <div id="under"></div>
  <div id="stage"></div>
  <div id="hud">loading…</div>
  <script type="module" src="./spline-splash.js"></script>
</body>
</html>
