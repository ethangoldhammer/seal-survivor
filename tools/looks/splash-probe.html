<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Splash probe — what is behind the title card</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden;
    font: 13px/1.5 'Inter', system-ui, sans-serif; color: #e8ecf3; }
  /* The thing the card is being held over. Anything the artboard paints over
     this is opaque; anything that shows through is a hole the seal can live in.
     A CHECKER rather than a flat fill, because a flat fill cannot tell a
     transparent artboard apart from one that happens to paint the same colour,
     and the grid also reads how far the `Contain` fit letterboxes on this
     aspect. */
  #under { position: absolute; inset: 0;
    background:
      repeating-conic-gradient(#ff00c8 0% 25%, #00e5ff 0% 50%) 0 0 / 64px 64px; }
  #stage { position: absolute; inset: 0; }
  #hud { position: absolute; left: 12px; bottom: 12px; z-index: 40; pointer-events: none;
    background: rgba(8,10,16,0.9); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 10px; padding: 8px 12px; white-space: pre; font-variant-numeric: tabular-nums; }
  /* ABOVE THE SPLASH AND CLICKABLE, which the HUD deliberately is not. The
     splash wrapper is z-index 20 and takes every pointer event on the page, so
     a control has to sit over it AND opt back into pointer events — and it
     cannot be a keyboard shortcut, because the splash keeps its hidden name
     field focused and any letter you press is typed into it instead. */
  #sweep { position: absolute; right: 12px; bottom: 12px; z-index: 41; pointer-events: auto;
    font: inherit; color: #e8ecf3; background: rgba(8,10,16,0.9); cursor: pointer;
    border: 1px solid rgba(255,255,255,0.28); border-radius: 10px; padding: 8px 12px; }
  #sweep:hover { border-color: #00e5ff; }
</style>
<script>
  // The Browser pane reports document.hidden, so Chrome suspends rAF and Rive —
  // whose entire render loop is requestAnimationFrame(this.draw) — paints one
  // frame and stops. That is indistinguishable from a .riv that draws nothing.
  // setTimeout is not throttled the same way. Gated so a real browser window
  // uses the real clock.
  if (!location.search.includes('raf=native')) {
    window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
    window.cancelAnimationFrame = (id) => clearTimeout(id);
  }
</script>
</head>
<body>
  <div id="under"></div>
  <div id="stage"></div>
  <div id="hud">loading…</div>
  <button id="sweep" type="button">sweep for live listeners</button>
  <script type="module" src="./splash-probe.js"></script>
</body>
</html>
