<!doctype html>
<meta charset="utf-8">
<title>hex picker</title>
<!--
  PICK WHICH HEXES GO IN THE GRID, AND WHERE.

    npm run pick
    open http://localhost:4601/hexpick.html

  The cluster of hexagons on a design board is real card art out of
  design/assets — the same hexes the level-up cards use. Choosing them by
  editing a list of filenames and re-publishing to see what happened is the
  loop this page removes: click a slot, click a picture, watch the cluster
  build up at the size and packing it ships at.

  THE HONEYCOMB IS THE REAL PACKING, not a guess at one. Flat-top hexagons
  tile at 3/4 of their width horizontally and a full height vertically, with
  every odd column dropped half a height — so what is on screen here is what
  lands on the board.

  Saving POSTs to hex-pick.json next to this file. Nothing here writes to the
  game: design/assets is mounted read-only and the only file that changes is
  that one list.
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d1418; color: #d6e6ef;
    font: 13px ui-monospace, SFMono-Regular, monospace; display: flex; height: 100vh; }
  #gallery { width: 300px; flex: none; overflow-y: auto; border-right: 1px solid #1e3542;
    padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    align-content: start; }
  #gallery figure { margin: 0; cursor: pointer; text-align: center; border-radius: 3px;
    padding: 4px; border: 1px solid transparent; }
  #gallery figure:hover { border-color: #2b6d8d; background: #142934; }
  #gallery figure.used { opacity: 0.35; }
  #gallery img { width: 100%; display: block; }
  #gallery figcaption { font-size: 9px; color: #7fa3b6; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 14px; gap: 12px; }
  #stageWrap { flex: 1; min-height: 0; display: grid; place-items: center;
    background:
      linear-gradient(135deg, #145e82 0%, #0a2b45 100%);
    border: 1px solid #1e3542; overflow: auto; }
  #stage { position: relative; }
  .slot { position: absolute; display: grid; place-items: center; cursor: pointer; }
  .slot .ph { width: 100%; height: 100%;
    clip-path: polygon(25% 2%, 75% 2%, 100% 50%, 75% 98%, 25% 98%, 0 50%);
    background: rgba(111,211,255,0.10); border: 0; }
  .slot.sel .ph { background: rgba(255,176,32,0.35); }
  /* The box IS the file, scaled — so the image fills it exactly and
     object-fit has nothing to correct. `contain` here would letterbox
     a square inside a square, i.e. do nothing, but saying `fill` makes
     the intent plain: the placement already did the fitting. */
  .slot img { width: 100%; height: 100%; display: block; object-fit: fill; }
  .slot .x { position: absolute; top: -2px; right: -2px; background: #5c1f1f; color: #ffd9d9;
    border: 0; border-radius: 50%; width: 16px; height: 16px; font: 10px monospace;
    cursor: pointer; display: none; }
  .slot:hover .x { display: block; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button.act { background: #17455c; color: #dff0f8; border: 1px solid #2b6d8d;
    padding: 7px 12px; border-radius: 3px; cursor: pointer; font: inherit; }
  button.act:hover { background: #1e5a78; }
  button.act.go { background: #1d5c34; border-color: #2f8a4e; }
  label.num { display: flex; gap: 6px; align-items: center; color: #82a9bc; font-size: 11px; }
  input[type=range] { width: 130px; }
  #status { color: #7fbf95; font-size: 11px; min-height: 15px; }
  #status.err { color: #e08a8a; }
  #hint { color: #6f97aa; font-size: 11px; }
</style>

<div id="gallery"></div>
<main>
  <div class="bar">
    <label class="num">columns <input type="range" id="cols" min="1" max="6" step="1"><output id="oCols"></output></label>
    <label class="num">per column <input type="range" id="rows" min="1" max="5" step="1"><output id="oRows"></output></label>
    <label class="num">hex size <input type="range" id="size" min="30" max="130" step="2"><output id="oSize"></output></label>
    <button class="act" id="bClear">clear all</button>
  </div>
  <div id="hint">click a slot, then a picture. click the × on a filled slot to empty it.</div>
  <div id="stageWrap"><div id="stage"></div></div>
  <div class="bar">
    <button class="act go" id="bSave">save hex-pick.json</button>
    <span id="status"></span>
  </div>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
// Flat-top hexagons pack at 3/4 width across and a full height down, with odd
// columns dropped half a height. Same geometry the hive uses; see the note at
// the top of this file.
//
// THE LATTICE IS THE VISIBLE HEXAGON, NEVER THE IMAGE BOX — this is the whole
// reason the cluster had gaps in it. Every one of these files is a 512-square
// with a hexagon somewhere inside it, and they are NOT framed alike: most sit
// at 5.66%-94.14% across, and AnglerFish.webp is a full-bleed crop at
// 0%-100%. Step by the box and you are stepping by a margin that differs per
// picture, so the hexes cannot meet however carefully the maths is done.
//
// So each image is MEASURED — the bounding box of its opaque pixels, which for
// this art is exactly the hexagon — and then scaled and offset so that its
// hexagon, not its file, lands on the lattice.
const XSTEP = 0.75;      // of the visible hexagon's WIDTH
const RATIO = 0.866;     // a regular flat-top hexagon's height / width
// A hair under the true step, so neighbours overlap by a fraction of a pixel
// rather than meeting exactly. Meeting exactly is a hairline of background at
// most zoom levels; the corners are transparent, so the overlap costs nothing.
const SNUG = 0.997;

// filename -> {l, t, w, h} as fractions of the square, measured once.
const bounds = new Map();

async function measure(name) {
  if (bounds.has(name)) return bounds.get(name);
  const img = new Image();
  img.src = '/hexart/' + name;
  await img.decode();
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.drawImage(img, 0, 0);
  const d = cx.getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let py = 0; py < c.height; py++) {
    for (let px = 0; px < c.width; px++) {
      // 16 rather than 0: these are drawn edges with a little antialiasing on
      // them, and counting a 1-alpha pixel as hexagon puts the bound a pixel
      // or two wide on every side.
      if (d[(py * c.width + px) * 4 + 3] < 16) continue;
      if (px < x0) x0 = px; if (px > x1) x1 = px;
      if (py < y0) y0 = py; if (py > y1) y1 = py;
    }
  }
  const b = x1 < 0
    ? { l: 0, t: 0, w: 1, h: 1 }
    : { l: x0 / c.width, t: y0 / c.height, w: (x1 + 1 - x0) / c.width, h: (y1 + 1 - y0) / c.height };
  bounds.set(name, b);
  return b;
}

/**
 * Where an image goes so its HEXAGON sits centred on the lattice cell.
 *
 * `size` is the visible hexagon's width, so the same number means the same
 * picture size whatever margin the file happens to carry.
 */
function placement(b, col, row, size) {
  const H = size * RATIO;
  const cx = col * XSTEP * size * SNUG + size / 2;
  const cy = row * H * SNUG + (col % 2 ? H / 2 : 0) + H / 2;
  const box = size / b.w;                       // scale the file so its hex is `size` wide
  return {
    left: cx - box * (b.l + b.w / 2),
    top: cy - box * (b.t + b.h / 2),
    box,
  };
}

let state = { cols: 3, rows: 3, size: 74, slots: {} }; // slots keyed "c,r" -> filename
let art = [];
let selected = null;

function status(m, err) { $('status').textContent = m; $('status').className = err ? 'err' : ''; }

function slotKey(c, r) { return `${c},${r}`; }

async function drawStage() {
  const s = $('stage');
  s.innerHTML = '';
  const size = state.size, H = size * RATIO;
  s.style.width = `${(state.cols - 1) * XSTEP * size * SNUG + size}px`;
  s.style.height = `${state.rows * H * SNUG + H / 2}px`;

  // Every picture in play, measured before anything is drawn — a slot placed
  // from a bounds entry that has not arrived yet would land at the file's
  // margin and jump when it did.
  await Promise.all([...new Set(Object.values(state.slots))].map(measure));

  for (let c = 0; c < state.cols; c++) {
    for (let r = 0; r < state.rows; r++) {
      const key = slotKey(c, r);
      const file = state.slots[key];
      const el = document.createElement('div');
      el.className = 'slot' + (selected === key ? ' sel' : '');

      if (file) {
        // A filled slot is the PICTURE, placed off its own measured hexagon.
        const p = placement(bounds.get(file), c, r, size);
        el.style.cssText = `left:${p.left}px; top:${p.top}px; width:${p.box}px; height:${p.box}px;`;
        const img = document.createElement('img');
        img.src = '/hexart/' + file;
        el.appendChild(img);
        const x = document.createElement('button');
        x.className = 'x'; x.textContent = '×';
        x.addEventListener('click', (e) => { e.stopPropagation(); delete state.slots[key]; drawStage(); drawGallery(); });
        el.appendChild(x);
      } else {
        // An empty slot has no picture to measure, so it draws the lattice
        // cell itself — the hexagon a picture dropped here would fill.
        const cx = c * XSTEP * size * SNUG, cy = r * H * SNUG + (c % 2 ? H / 2 : 0);
        el.style.cssText = `left:${cx}px; top:${cy}px; width:${size}px; height:${H}px;`;
        const ph = document.createElement('div');
        ph.className = 'ph';
        el.appendChild(ph);
      }
      el.addEventListener('click', () => { selected = key; drawStage(); });
      s.appendChild(el);
    }
  }
}

function drawGallery() {
  const g = $('gallery');
  g.innerHTML = '';
  const used = new Set(Object.values(state.slots));
  for (const name of art) {
    const f = document.createElement('figure');
    if (used.has(name)) f.classList.add('used');
    f.innerHTML = `<img src="/hexart/${name}" loading="lazy"><figcaption>${name.replace(/\.webp$/, '')}</figcaption>`;
    f.addEventListener('click', () => {
      if (!selected) { status('click a slot first', true); return; }
      state.slots[selected] = name;
      // Step to the next empty slot so filling a cluster is one click each
      // rather than a click-a-slot, click-a-picture rhythm all the way down.
      const keys = [];
      for (let c = 0; c < state.cols; c++) for (let r = 0; r < state.rows; r++) keys.push(slotKey(c, r));
      selected = keys.find((k) => !state.slots[k]) ?? selected;
      drawStage(); drawGallery(); status('');
    });
    g.appendChild(f);
  }
}

for (const [id, key, out] of [['cols', 'cols', 'oCols'], ['rows', 'rows', 'oRows'], ['size', 'size', 'oSize']]) {
  $(id).addEventListener('input', (e) => {
    state[key] = parseInt(e.target.value, 10);
    $(out).textContent = state[key];
    drawStage();
  });
}
$('bClear').addEventListener('click', () => { state.slots = {}; selected = null; drawStage(); drawGallery(); });

$('bSave').addEventListener('click', async () => {
  // Saved as a LIST with explicit column/row on each entry rather than as a
  // sparse grid object: whatever consumes this has to lay the cluster out, and
  // a list it can iterate beats a map it has to walk twice.
  const picks = Object.entries(state.slots)
    .map(([k, file]) => {
      const [c, r] = k.split(',').map(Number);
      // THE MEASUREMENT TRAVELS WITH THE PICK. Whatever lays this cluster out
      // downstream needs the hexagon's box, and it may have no way to measure
      // one — an image decoder and a canvas is a lot to ask of a build step
      // when the answer is four numbers that were worked out here.
      const b = bounds.get(file) ?? { l: 0, t: 0, w: 1, h: 1 };
      return { col: c, row: r, file, hex: { l: +b.l.toFixed(5), t: +b.t.toFixed(5), w: +b.w.toFixed(5), h: +b.h.toFixed(5) } };
    })
    .sort((a, b) => a.col - b.col || a.row - b.row);
  const body = JSON.stringify({
    cols: state.cols, rows: state.rows, size: state.size,
    // The lattice constants, so the consumer is not re-deriving them from a
    // comment in a different file.
    lattice: { xstep: XSTEP, ratio: RATIO, snug: SNUG },
    picks,
  }, null, 2);
  try {
    const res = await fetch('/spec/hex-pick.json', { method: 'POST', body });
    if (!res.ok) throw new Error(await res.text());
    status(`saved ${picks.length} hex${picks.length === 1 ? '' : 'es'} to hex-pick.json`);
  } catch (err) { status('save failed: ' + err.message, true); }
});

// The gallery is whatever is on disk. No hand-written list: art gets added to
// design/assets and it appears here, which is the only arrangement that cannot
// go stale.
const res = await fetch('/hexart.json');
art = (await res.json()).filter((n) => /\.(webp|png|jpg|jpeg|avif)$/i.test(n)).sort();

const saved = await fetch('/hex-pick.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
if (saved) {
  state.cols = saved.cols ?? state.cols;
  state.rows = saved.rows ?? state.rows;
  state.size = saved.size ?? state.size;
  for (const p of saved.picks ?? []) state.slots[slotKey(p.col, p.row)] = p.file;
}
$('cols').value = state.cols; $('oCols').textContent = state.cols;
$('rows').value = state.rows; $('oRows').textContent = state.rows;
$('size').value = state.size; $('oSize').textContent = state.size;
selected = slotKey(0, 0);
drawStage(); drawGallery();
</script>
