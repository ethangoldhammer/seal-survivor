<!doctype html>
<meta charset="utf-8">
<title>atlas renderer</title>
<style>body{margin:0;background:#111;color:#ddd;font:13px monospace}
#log{padding:10px;white-space:pre-wrap;max-height:40vh;overflow:auto}
canvas{display:block;margin:8px auto;background:#222}</style>
<div id="log">booting…</div>
<script type="importmap">
{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}
</script>
<script type="module">
// The batch driver: read a spec list, render every entry, POST each PNG back.
//
// All the actual rendering lives in iconRender.js, shared with picker.html so
// the angles chosen there mean the same thing here. See that file's header.
import { makeRenderer, shootToBlob } from './iconRender.js';

const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
const renderer = makeRenderer();
document.body.appendChild(renderer.domElement);

// `?list=icons.json` picks a different spec file; the default is the atlas's.
//
// FETCHED WITH ITS OWN ERROR PATH, because the failure is otherwise invisible.
// The server answers a missing file with the body `missing`, .json() throws on
// the `m`, and since this is module top level the throw takes the whole script
// out — leaving the page showing "booting…" and a blank canvas forever, which
// reads as a hung renderer rather than as a file that isn't there. Both lists
// are generated, so a fresh checkout hits this on the first run every time.
const listName = new URLSearchParams(location.search).get('list') ?? 'list.json';
let specs;
try {
  const res = await fetch('/' + listName);
  if (!res.ok) throw new Error(`${res.status} — ${listName} is generated; run the tool that writes it`);
  specs = await res.json();
} catch (err) {
  document.getElementById('log').textContent =
    `CANNOT LOAD /${listName}\n\n${err.message}\n\n` +
    `  upgrade icons:  node --import ./tools/vite-loader.mjs tools/upgrade-icons.mjs\n` +
    `                  then open render.html?list=icons.json\n` +
    `                  (or pick the angles by eye: picker.html)\n\n` +
    `  model atlas:    node --import ./tools/vite-loader.mjs tools/atlas-data.mjs --out <dir>\n` +
    `                  then copy <dir>/list.json next to this page`;
  throw err;
}

window.__total = specs.length;
window.__done = 0;
window.__fails = [];
document.getElementById('log').textContent = `rendering ${specs.length} models`;

// A spec list can now hold rows this page has no business rendering: an icon set
// to a drawn file, and one deliberately set to no picture at all. Both are
// skipped rather than failed — `--bake` is what reads those, and a FAIL line for
// every monogram would bury the real failures. The atlas's own list names no
// `kind`, so all of it still renders.
let skipped = 0;
for (const spec of specs) {
  const kind = spec.kind ?? 'render';
  // `scene` renders exactly like `render` — it is still a WebGL shot POSTed
  // under the spec's key, it just has several models in it instead of one.
  if (kind !== 'render' && kind !== 'scene') { skipped++; window.__done++; continue; }
  try {
    const { blob, log: line } = await shootToBlob(renderer, spec);
    await fetch('/shot/' + spec.key + '.png', { method: 'POST', body: blob });
    log(line);
  } catch (err) {
    window.__fails.push(spec.key + ': ' + (err?.message ?? err));
    log(`FAIL ${spec.key}: ${err?.message ?? err}`);
  }
  window.__done++;
}
window.__skipped = skipped;
window.__finished = true;
log(`\nDONE ${window.__done - skipped}/${specs.length - skipped} rendered`
  + (skipped ? `, ${skipped} not renders (drawn or none)` : '')
  + `, ${window.__fails.length} failed`);
</script>
